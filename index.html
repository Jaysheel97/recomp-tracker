/* Portion model: a food can be entered three ways.
     'serving' - a count x a named serving   (2 x "1 roti (40g)" = 80g)
     'raw'     - a direct weight             (137g)
     'unit'    - foods with no presets; qty is already in native units (2 bananas)
   `qty` in the food's native unit remains the single source of truth for macros,
   so srv/cnt are only a record of how the user arrived at it and older saved
   items without those fields keep working. */
function itemPortion(item, ing){
  const servings = Array.isArray(ing.servings) ? ing.servings : [];
  if(!servings.length) return {mode:'unit'};
  if(item.srv === null) return {mode:'raw'};
  if(Number.isInteger(item.srv) && servings[item.srv]){
    const g = servings[item.srv].g;
    return {mode:'serving', srvIdx:item.srv, cnt:(item.cnt != null ? item.cnt : (g ? item.qty/g : 1))};
  }
  // Legacy item saved before portions existed: infer a clean serving if one fits.
  for(let i=0;i<servings.length;i++){
    const g = servings[i].g;
    if(!g) continue;
    const c = item.qty / g;
    if(c > 0 && Math.abs(c - Math.round(c)) < 0.001) return {mode:'serving', srvIdx:i, cnt:Math.round(c)};
  }
  return {mode:'raw'};
}
function displayQty(item, ing){
  if(item.mUnit === 'ml' && ing.dens) return Math.round(item.qty / ing.dens);
  return item.qty;
}
function qtyFromDisplay(val, item, ing){
  if(item.mUnit === 'ml' && ing.dens) return val * ing.dens;
  return val;
}
function trimNum(n){
  if(!isFinite(n)) return '0';
  return String(Math.round(n * 100) / 100);
}

/* ===================== MODAL EVENT WIRING ===================== */
function attachSelectedItemsEvents(){
  const container = document.getElementById('selectedItems');
  if(!container) return;

  // Refresh only the numbers, never the inputs themselves: rebuilding the row
  // while someone is typing steals focus and closes the mobile keyboard.
  const refreshNumbers = (idx)=>{
    const m = itemMacros(modalState.items[idx]);
    const subEl = document.getElementById(`item-sub-${idx}`);
    if(subEl) subEl.textContent = `${m.kcal.toFixed(0)} kcal`;
    const totalEl = document.getElementById('modalTotal');
    if(totalEl) totalEl.innerHTML = renderModalTotalText();
  };
  const rebuildRows = ()=>{
    container.innerHTML = renderSelectedItems();
    const totalEl = document.getElementById('modalTotal');
    if(totalEl) totalEl.innerHTML = renderModalTotalText();
    attachSelectedItemsEvents();
    updateReuseVisibility();
  };

  // Count of servings: 2 x "1 roti" -> qty 80g
  container.querySelectorAll('.cnt-input').forEach(input=>{
    input.addEventListener('input', (e)=>{
      const idx = parseInt(e.target.dataset.idx, 10);
      const item = modalState.items[idx];
      const ing = ingredientById(item.ing);
      const port = itemPortion(item, ing);
      if(port.mode !== 'serving') return;
      const cnt = clamp0(parseFloat(e.target.value));
      const g = ing.servings[port.srvIdx].g;
      item.cnt = cnt;
      item.srv = port.srvIdx;
      item.qty = cnt * g;
      const qtyInput = container.querySelector(`.qty-input[data-idx="${idx}"]`);
      if(qtyInput) qtyInput.value = trimNum(displayQty(item, ing));
      refreshNumbers(idx);
    });
  });

  // Final quantity, always directly editable. Typing a weight keeps the chosen
  // serving but recomputes the count, so the row stays internally consistent.
  container.querySelectorAll('.qty-input').forEach(input=>{
    input.addEventListener('input', (e)=>{
      const idx = parseInt(e.target.dataset.idx, 10);
      const item = modalState.items[idx];
      const ing = ingredientById(item.ing);
      item.qty = clamp0(qtyFromDisplay(parseFloat(e.target.value) || 0, item, ing));
      const port = itemPortion(item, ing);
      if(port.mode === 'serving'){
        const g = ing.servings[port.srvIdx].g;
        if(g){
          item.cnt = item.qty / g;
          const cntInput = container.querySelector(`.cnt-input[data-idx="${idx}"]`);
          if(cntInput && document.activeElement !== cntInput) cntInput.value = trimNum(item.cnt);
        }
      }
      refreshNumbers(idx);
    });
  });

  // Serving selector, including the "grams" escape hatch for raw weights.
  container.querySelectorAll('.preset-select').forEach(sel=>{
    sel.addEventListener('change', (e)=>{
      const idx = parseInt(e.target.dataset.idx, 10);
      const item = modalState.items[idx];
      const ing = ingredientById(item.ing);
      const val = e.target.value;
      if(val === 'raw'){
        item.srv = null;
        item.cnt = null;
      }else{
        const i = parseInt(val, 10);
        const g = ing.servings[i] ? ing.servings[i].g : 0;
        const prev = itemPortion(item, ing);
        const cnt = (prev.mode === 'serving' && prev.cnt > 0) ? prev.cnt : 1;
        item.srv = i;
        item.cnt = cnt;
        item.qty = cnt * g;
      }
      rebuildRows(); // switching mode changes which controls exist
    });
  });

  // Grams <-> millilitres. The stored quantity stays in grams; only the reading changes.
  container.querySelectorAll('.unit-select').forEach(sel=>{
    sel.addEventListener('change', (e)=>{
      const idx = parseInt(e.target.dataset.idx, 10);
      modalState.items[idx].mUnit = e.target.value === 'ml' ? 'ml' : 'g';
      rebuildRows();
    });
  });

  container.querySelectorAll('[data-action="remove-item"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const idx = parseInt(e.currentTarget.dataset.idx, 10);
      modalState.items.splice(idx, 1);
      rebuildRows();
    });
  });
}

/* Dialog accessibility: focus must enter the dialog when it opens, stay inside
   while it's open, return to where it came from on close, and Escape must work.
   Without this a keyboard or screen-reader user is left tabbing the page behind. */
let lastFocusSelector = null;
function selectorForFocus(el){
  if(!el || el === document.body) return null;
  if(el.id) return '#' + el.id;
  const action = el.getAttribute && el.getAttribute('data-action');
  if(action){
    const id = el.getAttribute('data-id');
    const idx = el.getAttribute('data-idx');
    if(id) return `[data-action="${action}"][data-id="${id}"]`;
    if(idx) return `[data-action="${action}"][data-idx="${idx}"]`;
    return `[data-action="${action}"]`;
  }
  const cls = (el.className || '').toString().trim().split(/\s+/)[0];
  return cls ? '.' + cls : null;
}
function focusableIn(root){
  return Array.from(root.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && !el.hidden && el.offsetParent !== null);
}
function attachDialogA11y(root, onClose){
  const focusables = focusableIn(root);
  if(focusables.length) focusables[0].focus();
  root.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){ e.preventDefault(); onClose(); return; }
    if(e.key !== 'Tab') return;
    const list = focusableIn(root);
    if(!list.length) return;
    const first = list[0], last = list[list.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
}
function restoreFocusAfterModal(){
  const sel = lastFocusSelector;
  lastFocusSelector = null;
  if(!sel) return;
  // The dialog closes via render(), so wait for the new DOM before focusing.
  requestAnimationFrame(()=>{
    try{
      const el = document.querySelector(sel);
      if(el && typeof el.focus === 'function') el.focus();
    }catch(e){}
  });
}

/* ===================== MAIN RENDER (async, race-guarded, two views) ===================== */
let currentView = 'today'; // 'today' | 'progress'

let lastRenderError = null;

async function render(){
  const myToken = ++renderToken;
  try{
    // A user who has not completed setup sees only onboarding.
    if(meta && meta.profile && !meta.profile.onboarded){
      if(!onboardState) startOnboarding();
      const app = document.getElementById('app');
      app.innerHTML = renderOnboarding();
      attachOnboardingEvents();
      return;
    }
    if(currentView === 'today') await renderTodayView(myToken);
    else if(currentView === 'progress') await renderProgressView(myToken);
    else if(currentView === 'foods') await renderFoodsView(myToken);
    else if(currentView === 'settings') await renderSettingsView(myToken);
    else if(currentView === 'planedit') await renderPlanEditorView(myToken);
    else await renderTodayView(myToken);
  }catch(err){
    // An exception here previously left a blank screen with the user's data
    // apparently gone. Show a recoverable panel instead — the data is still in
    // storage, so offer a backup download before anything else.
    lastRenderError = err;
    renderErrorBoundary(err);
  }
}

// Switching bottom-nav tabs used to be an instant hard cut, which read as a
// different (cheaper) transition language than the day-swipe's slide. A short
// cross-fade puts both on the same footing without slowing navigation down.
let viewSwitching = false;
async function switchView(view){
  if(view === currentView || viewSwitching) return;
  const app = document.getElementById('app');
  if(!app || prefersReducedMotion()){ currentView = view; await render(); return; }
  viewSwitching = true;
  try{
    await app.animate([{opacity:1},{opacity:0}], {duration:100, easing:'ease-out'}).finished;
    currentView = view;
    await render();
    await app.animate([{opacity:0},{opacity:1}], {duration:140, easing:'ease-out'}).finished;
  } finally { viewSwitching = false; }
}

function renderErrorBoundary(err){
  const app = document.getElementById('app');
  if(!app) return;
  const msg = (err && err.message) ? err.message : String(err);
  app.innerHTML = `
    <div class="error-boundary">
      <div class="eb-title">Something went wrong displaying this screen</div>
      <div class="eb-body">Your saved data is safe — this is a display problem, not a data problem. Try reloading. If it keeps happening, download a backup first so nothing is at risk.</div>
      <div class="eb-actions">
        <button type="button" class="btn-primary" id="ebReload">Reload</button>
        <button type="button" class="btn-ghost" id="ebBackup">Download backup</button>
      </div>
      <details class="eb-details"><summary>Technical details</summary><pre>${escapeHtml(msg)}</pre></details>
    </div>
  `;
  const reload = document.getElementById('ebReload');
  if(reload) reload.addEventListener('click', ()=>window.location.reload());
  const backup = document.getElementById('ebBackup');
  if(backup) backup.addEventListener('click', ()=>{ downloadBackup().catch(()=>{}); });
}

function attachFoodEditorEvents(){
  const backdrop = document.getElementById('foodEditBackdrop');
  if(!backdrop) return;
  const st = foodEditState;
  const close = ()=>{ foodEditState = null; render(); restoreFocusAfterModal(); };
  const dlg = backdrop.querySelector('.modal');
  if(dlg && !dlg.dataset.a11yBound){ dlg.dataset.a11yBound='1'; attachDialogA11y(dlg, close); }
  document.getElementById('feClose').addEventListener('click', close);
  document.getElementById('feCancel').addEventListener('click', close);
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });

  const bind = (id, key)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', e=>{ st[key]=e.target.value; }); };
  bind('feName','name'); bind('feKcal','kcal'); bind('feP','p'); bind('feC','c'); bind('feF','f'); bind('feFib','fib');
  bind('feServingLabel','servingLabel'); bind('feServingGrams','servingGrams');
  const liq = document.getElementById('feLiquid');
  if(liq) liq.addEventListener('change', e=>{ st.isLiquid = e.target.checked; });

  document.getElementById('feSave').addEventListener('click', ()=>{
    const name = st.name.trim();
    if(!name){ st.error = 'Give the food a name.'; render(); return; }
    const food = (meta.customFoods||[]).find(x=>x.id===st.id);
    if(!food){ close(); return; }
    const before = deepClone(food);
    food.name = name;
    food.kcal = clamp0(parseFloat(st.kcal));
    food.p = clamp0(parseFloat(st.p));
    food.c = clamp0(parseFloat(st.c));
    food.f = clamp0(parseFloat(st.f));
    food.fib = clamp0(parseFloat(st.fib));
    if(st.unit === 'g'){
      const g = clamp0(parseFloat(st.servingGrams));
      food.servings = (g > 0)
        ? [{label: st.servingLabel.trim() || '1 serving', g}]
        : [];
      food.dens = st.isLiquid ? (liquidDensityFor(name, '') || 1.0) : null;
    }
    invalidateFoodPool();
    persistMeta();
    foodEditState = null;
    offerUndo(`Updated "${before.name}"`, async ()=>{
      const idx = meta.customFoods.findIndex(x=>x.id===before.id);
      if(idx >= 0) meta.customFoods[idx] = before;
      invalidateFoodPool();
      await persistMeta();
      render();
    });
    render();
    restoreFocusAfterModal();
  });
}

function deleteCustomFood(id){
  const idx = (meta.customFoods||[]).findIndex(f=>f.id===id);
  if(idx < 0) return;
  const removed = meta.customFoods[idx];
  meta.customFoods.splice(idx,1);
  invalidateFoodPool();
  persistMeta();
  offerUndo(`Removed "${removed.name}"`, async ()=>{
    meta.customFoods.splice(idx, 0, removed);
    invalidateFoodPool();
    await persistMeta();
    render();
  });
  render();
}

/* ===================== ONBOARDING (Phase 1b) =====================
   Runs only when profile.onboarded is false — existing users are marked
   onboarded by the Phase 0 migration and never see this. */
let onboardState = null;

function startOnboarding(){
  onboardState = {
    step: 0,
    mode: null,              // 'plan' | 'log'
    dayTypes: DEFAULT_DAY_TYPES.slice(),
    targets: {kcal:'', p:'', c:'', f:''},
    usesTrainingDays: null,  // bool
  };
}
function emptyDayTemplate(){
  return [
    {id:'breakfast', name:'Breakfast', items:[]},
    {id:'lunch', name:'Lunch', items:[]},
    {id:'dinner', name:'Dinner', items:[]},
    {id:'snacks', name:'Snacks', items:[]},
  ];
}
function onboardingTotalSteps(){
  if(!onboardState || !onboardState.mode) return 4;
  return onboardState.mode === 'plan' ? 2 : 4;
}
function renderOnboarding(){
  const s = onboardState;
  const total = onboardingTotalSteps();
  let body = '';

  if(s.step === 0){
    body = `

    body = `
      <div class="ob-title">Your daily targets</div>

      <div class="macro-input-grid">

  }
  else if(s.step === 2 && s.mode === 'log'){
    body = `
      <div class="ob-title">Do you eat differently on training days?</div>
      <div class="ob-sub">Some people eat more on days they train. If not, one target applies every day.</div>
      <div class="ob-choices">

          <div class="ob-choice-t">Training vs rest days</div>
          <div class="ob-choice-d">Pick which days you train on the next screen.</div>
        </button>
      </div>`;
  }
  else if(s.step === 3 || (s.step === 1 && s.mode === 'plan')){
    body = `
      <div class="ob-title">Which days do you train?</div>
      <div class="ob-sub">Tap to toggle. This sets which days use your training targets.</div>
      ${renderDayTypePicker(s.dayTypes, 'ob')}`;
  }

  const canAdvance = onboardingCanAdvance();
  return `
    <div class="onboard-wrap">

      <div class="ob-card">

          ${s.step > 0 ? `<button type="button" class="btn-ghost" data-ob="back">Back</button>` : ''}

function renderDayTypePicker(dayTypes, prefix){
  const labels = ['S','M','T','W','T','F','S'];
  const full = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return `<div class="daytype-picker">${dayTypes.map((t,i)=>`
    <button type="button" class="daytype-btn ${t==='training'?'training':'rest'}"

    </button>`).join('')}</div>`;

function onboardingIsLastStep(){
  const s = onboardState;
  if(s.mode === 'plan') return s.step === 1;
  if(s.mode === 'log') return s.step === 3 || (s.step === 2 && s.usesTrainingDays === false);
  return false;
}
function onboardingCanAdvance(){
  const s = onboardState;
  if(s.step === 0) return !!s.mode;
  if(s.step === 1 && s.mode === 'log'){
    return clamp0(parseFloat(s.targets.kcal)) > 0;
  }
  if(s.step === 2 && s.mode === 'log') return s.usesTrainingDays !== null;
  return true;
}
function onboardingNextStep(){
  const s = onboardState;
  if(s.mode === 'plan'){ s.step = 1; return; }
  if(s.step === 0){ s.step = 1; return; }
  if(s.step === 1){ s.step = 2; return; }
  if(s.step === 2){ s.step = 3; return; }
}
/* Days are materialised from the template the first time they're viewed. After
   setup changes the plan, any day that was only ever auto-created (never
   actually logged) is stale — it still holds the OLD plan's meals. Drop those
   so they regenerate from the new template. Days with real data are kept. */
async function clearUnloggedDays(){
  const keys = await listMonthKeys();
  for(const k of keys){
    const mk = k.replace('dietTracker:days:', '');
    await ensureMonthLoaded(mk);
    const days = monthCache[mk];
    let changed = false;
    for(const dk of Object.keys(days)){
      if(isDayMeaningfullyEmpty(days[dk])){ delete days[dk]; changed = true; }
    }
    if(changed) await persistMonth(mk);
  }
}

async function finishOnboarding(){
  const s = onboardState;
  const prof = meta.profile;
  // Entering setup again touches nothing on its own -- only finishing it
  // overwrites the plan, so this is where undo protection actually belongs,
  // in place of a confirm() gate at entry.
  const wasOnboarded = prof.onboarded;
  const prevShape = deepClone({
    templates: prof.templates, targetsMode: prof.targetsMode,
    targets: prof.targets, dayTypes: prof.dayTypes,
  });
  if(s.mode === 'plan'){
    prof.templates = { training: deepClone(DEFAULT_TRAINING_TEMPLATE), rest: deepClone(DEFAULT_REST_TEMPLATE) };
    prof.targetsMode = 'auto';
    prof.dayTypes = s.dayTypes.slice();
  }else{
    const t = {
      kcal: clamp0(parseFloat(s.targets.kcal)),
      p: clamp0(parseFloat(s.targets.p)),
      c: clamp0(parseFloat(s.targets.c)),
      f: clamp0(parseFloat(s.targets.f)),
    };
    prof.templates = { training: emptyDayTemplate(), rest: emptyDayTemplate() };
    prof.targetsMode = 'manual';
    prof.targets = { training: {...t}, rest: {...t} };
    prof.dayTypes = (s.usesTrainingDays === true) ? s.dayTypes.slice()
                                                 : ['training','training','training','training','training','training','training'];
  }
  prof.onboarded = true;
  onboardState = null;
  await persistMeta();
  await clearUnloggedDays();
  // Setup is usually launched from Settings; finishing it should land the user
  // on their day, not back in the settings screen they came from.
  currentView = 'today';
  currentDate = new Date();
  render();
  // First-time setup has nothing meaningful to revert to; only a re-run,
  // which just replaced an existing plan, gets the undo offer.
  if(wasOnboarded){
    offerUndo('Plan updated from setup', async ()=>{
      prof.templates = prevShape.templates;
      prof.targetsMode = prevShape.targetsMode;
      prof.targets = prevShape.targets;
      prof.dayTypes = prevShape.dayTypes;
      await persistMeta();
      render();
    });
  }
}
function attachOnboardingEvents(){
  const wrap = document.querySelector('.onboard-wrap');
  if(!wrap) return;
  const s = onboardState;
  wrap.addEventListener('click', (e)=>{
    const el = e.target.closest('[data-ob]');
    if(!el) return;
    const a = el.dataset.ob;
    if(a === 'mode-log'){ s.mode = 'log'; render(); }
    else if(a === 'mode-plan'){ s.mode = 'plan'; render(); }
    else if(a === 'same-every-day'){ s.usesTrainingDays = false; render(); }
    else if(a === 'split-days'){ s.usesTrainingDays = true; render(); }
    else if(a === 'daytype'){
      const i = parseInt(el.dataset.idx, 10);
      s.dayTypes[i] = s.dayTypes[i] === 'training' ? 'rest' : 'training';
      render();
    }
    else if(a === 'back'){ s.step = Math.max(0, s.step - 1); render(); }
    else if(a === 'next'){
      if(onboardingIsLastStep()) finishOnboarding();
      else { onboardingNextStep(); render(); }
    }
  });
  ['obKcal','obP','obC','obF'].forEach((id, i)=>{
    const key = ['kcal','p','c','f'][i];
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ev=>{
      s.targets[key] = ev.target.value;
      const nextBtn = wrap.querySelector('[data-ob="next"]');
      if(nextBtn) nextBtn.disabled = !onboardingCanAdvance();
    });
  });
}

/* ---- Undo ----
   Destructive actions keep a snapshot rather than asking for confirmation.
   Undoing is faster than confirming, and it never blocks the common case. */
let undoEntry = null;
let undoTimer = null;

function offerUndo(label, restoreFn){
  undoEntry = {label, restoreFn};
  clearTimeout(undoTimer);
  renderUndoBar();
  undoTimer = setTimeout(()=>{ undoEntry = null; renderUndoBar(); }, 7000);
}
function renderUndoBar(){
  let el = document.getElementById('undoBar');
  if(!el){
    el = document.createElement('div');
    el.id = 'undoBar';
    el.className = 'undo-bar';
    document.body.appendChild(el);
  }
  if(!undoEntry){ el.className = 'undo-bar'; el.innerHTML = ''; return; }
  el.className = 'undo-bar visible';
  el.innerHTML = `<span>${escapeHtml(undoEntry.label)}</span><button type="button" id="undoBtn">Undo</button>`;
  const btn = document.getElementById('undoBtn');
  if(btn) btn.addEventListener('click', async ()=>{
    const fn = undoEntry && undoEntry.restoreFn;
    undoEntry = null;
    clearTimeout(undoTimer);
    renderUndoBar();
    if(fn) await fn();
  });
}

/* ---- Copy a previous day ---- */
async function copyDayFrom(sourceDate){
  const srcDay = await peekDay(sourceDate);
  if(!srcDay || !srcDay.meals.length) return false;
  const key = dateStr(currentDate);
  const mk = monthKeyFor(currentDate);
  await ensureMonthLoaded(mk);
  const prev = monthCache[mk][key] ? deepClone(monthCache[mk][key]) : null;
  const day = await getOrInitDay(key, currentDate);
  // Copy the food, not the ticks: what was eaten yesterday isn't eaten today.
  day.meals = srcDay.meals.map(m=>({
    id: 'meal-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
    name: m.name,
    checked: false,
    items: deepClone(m.items || []),
    manualMacros: m.manualMacros ? {...m.manualMacros} : null,
  }));
  await persistMonth(mk);
  offerUndo('Copied a previous day', async ()=>{
    if(prev) monthCache[mk][key] = prev; else delete monthCache[mk][key];
    await persistMonth(mk);
    render();
  });
  render();
  return true;
}

/* ---- Shared day-range loader for the trend and estimate views ---- */
async function loadDayRange(numDays){
  const end = new Date();
  const months = new Set();
  for(let i=0;i<numDays;i++){ const d=new Date(end); d.setDate(d.getDate()-i); months.add(monthKeyFor(d)); }
  for(const m of months) await ensureMonthLoaded(m);
  const out = [];
  for(let i=numDays-1;i>=0;i--){
    const d = new Date(end); d.setDate(d.getDate()-i);
    const m = monthKeyFor(d), key = dateStr(d);
    const day = (monthCache[m] && monthCache[m][key]) ? monthCache[m][key] : null;
    const type = day ? day.type : dayTypeFor(d);
    const eaten = day ? checkedTotals(day.meals) : {kcal:0,p:0,c:0,f:0};
    out.push({
      date: key,
      dayIndex: numDays - 1 - i,          // 0 = oldest in range
      logged: !!(day && dayHasAnyChecked(day.meals)),
      eaten,
      target: targetFor(type),
      weight: (day && day.body && day.body.weight != null) ? day.body.weight : null,
    });
  }
  return out;
}

/* ---- Adaptive targets ----
   Formulae like Mifflin-St Jeor are a starting guess. Once there is real data,
   observed weight change against observed intake gives a far better estimate of
   actual maintenance: if intake holds steady and weight holds steady, that
   intake IS maintenance, whatever any equation says.

     TDEE ≈ mean intake − (weight trend in lb/day × 3500 kcal/lb)

   The trend comes from a least-squares fit rather than first-vs-last, because
   day-to-day weight swings of 2-3 lb from water and food volume would otherwise
   dominate. Crucially this refuses to answer without enough data: a confident
   wrong number here would push targets the wrong way for weeks. */
const KCAL_PER_LB = 3500;
const ADAPTIVE_MIN_LOGGED_DAYS = 10;
const ADAPTIVE_MIN_WEIGHTS = 4;
const ADAPTIVE_MIN_SPAN_DAYS = 14;

function linearTrend(points){
  // points: [{x, y}] -> slope in y-units per x-unit
  const n = points.length;
  if(n < 2) return null;
  let sx=0, sy=0, sxy=0, sxx=0;
  for(const pt of points){ sx+=pt.x; sy+=pt.y; sxy+=pt.x*pt.y; sxx+=pt.x*pt.x; }
  const denom = n*sxx - sx*sx;
  if(Math.abs(denom) < 1e-9) return null;
  return (n*sxy - sx*sy) / denom;
}

async function computeAdaptiveEstimate(windowDays){
  const days = await loadDayRange(windowDays || 28);
  const loggedDays = days.filter(d=>d.logged);
  const weights = days.filter(d=>d.weight != null);

  const reasons = [];
  if(loggedDays.length < ADAPTIVE_MIN_LOGGED_DAYS)
    reasons.push(`${loggedDays.length} of ${ADAPTIVE_MIN_LOGGED_DAYS} days of food logged`);
  if(weights.length < ADAPTIVE_MIN_WEIGHTS)
    reasons.push(`${weights.length} of ${ADAPTIVE_MIN_WEIGHTS} weigh-ins`);
  const span = weights.length >= 2 ? (weights[weights.length-1].dayIndex - weights[0].dayIndex) : 0;
  if(weights.length >= 2 && span < ADAPTIVE_MIN_SPAN_DAYS)
    reasons.push(`weigh-ins span ${span} days, need ${ADAPTIVE_MIN_SPAN_DAYS}`);

  if(reasons.length) return {ready:false, reasons, loggedDays:loggedDays.length, weighIns:weights.length};

  const slopePerDay = linearTrend(weights.map(w=>({x:w.dayIndex, y:w.weight})));
  if(slopePerDay === null) return {ready:false, reasons:['not enough variation in weigh-ins to read a trend']};

  const meanIntake = loggedDays.reduce((a,d)=>a+d.eaten.kcal, 0) / loggedDays.length;
  const tdee = meanIntake - (slopePerDay * KCAL_PER_LB);
  const meanProtein = loggedDays.reduce((a,d)=>a+d.eaten.p, 0) / loggedDays.length;

  return {
    ready: true,
    tdee,
    meanIntake,
    meanProtein,
    lbPerWeek: slopePerDay * 7,
    loggedDays: loggedDays.length,
    weighIns: weights.length,
    spanDays: span,
    // Coverage is how much of the window actually has food logged; a 28-day
    // window with 11 logged days is a much weaker estimate than one with 26.
    coverage: loggedDays.length / days.length,
  };
}

/* ---- Progress data aggregation ---- */
async function getBodyLogSeries(numDays){
  const end = new Date();
  const monthsNeeded = new Set();
  for(let i=0;i<numDays;i++){ const d=new Date(end); d.setDate(d.getDate()-i); monthsNeeded.add(monthKeyFor(d)); }
  for(const mk of monthsNeeded) await ensureMonthLoaded(mk);
  const points = [];
  for(let i=numDays-1;i>=0;i--){
    const d = new Date(end); d.setDate(d.getDate()-i);
    const mk = monthKeyFor(d), key = dateStr(d);
    const day = monthCache[mk] ? monthCache[mk][key] : null;
    if(day && day.body && (day.body.weight!=null || day.body.bf!=null || day.body.smm!=null)){
      points.push({date:key, weight:day.body.weight, bf:day.body.bf, smm:day.body.smm});
    }
  }
  return points;
}
async function getInBodyHistory(){
  const points = await getBodyLogSeries(180);
  return points.filter(p=>p.bf!=null || p.smm!=null);
}
async function computeConsistency(){
  const numDays = 30;
  const end = new Date();
  const monthsNeeded = new Set();
  for(let i=0;i<numDays;i++){ const d=new Date(end); d.setDate(d.getDate()-i); monthsNeeded.add(monthKeyFor(d)); }
  for(const mk of monthsNeeded) await ensureMonthLoaded(mk);
  let proteinHit=0, calorieOnTarget=0, liftingDays=0, cardioDays=0, yogaDays=0, totalConsidered=0;
  for(let i=0;i<numDays;i++){
    const d = new Date(end); d.setDate(d.getDate()-i);
    const mk = monthKeyFor(d), key = dateStr(d);
    const day = monthCache[mk] ? monthCache[mk][key] : null;
    if(!day) continue;
    totalConsidered++;
    const target = targetFor(day.type);
    const eaten = checkedTotals(day.meals);
    if(target.p>0 && eaten.p >= target.p*0.95) proteinHit++;
    if(target.kcal>0 && Math.abs(eaten.kcal-target.kcal) <= target.kcal*0.1) calorieOnTarget++;
    if(day.training && day.training.liftingDone) liftingDays++;
    if(day.training && day.training.cardioDone) cardioDays++;
    if(day.training && day.training.yogaDone) yogaDays++;
  }
  return {proteinHit, calorieOnTarget, liftingDays, cardioDays, yogaDays, totalConsidered};
}

/* ---- Macro trend chart: 7-day rolling average against target ---- */
function renderTrendSection(days){
  const loggedCount = days.filter(d=>d.logged).length;
  if(loggedCount < 5){
    return `<section class="progress-card"><h2 class="panel-head">Intake trend</h2>
      <div class="empty-hint">Log a few more days and your rolling average will appear here.</div></section>`;
  }
  // A 7-day rolling mean is the right lens: single days swing wildly, the
  // weekly average is what actually drives body composition.
  const series = [];
  for(let i=0;i<days.length;i++){
    const win = days.slice(Math.max(0,i-6), i+1).filter(d=>d.logged);
    if(win.length < 3){ series.push(null); continue; }
    series.push({
      kcal: win.reduce((a,d)=>a+d.eaten.kcal,0)/win.length,
      target: win.reduce((a,d)=>a+d.target.kcal,0)/win.length,
      date: days[i].date,
    });
  }
  const pts = series.map((v,i)=>({v,i})).filter(x=>x.v);
  if(pts.length < 2){
    return `<section class="progress-card"><h2 class="panel-head">Intake trend</h2>
      <div class="empty-hint">Log a few more days and your rolling average will appear here.</div></section>`;
  }
  const vals = pts.flatMap(p=>[p.v.kcal, p.v.target]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max-min)*0.2 || 150;
  const yMin = Math.max(0, min-pad), yMax = max+pad;
  const w=500,h=170,mL=44,mR=10,mT=12,mB=22, plotW=w-mL-mR, plotH=h-mT-mB;
  const firstI = pts[0].i, lastI = pts[pts.length-1].i;
  const spanI = Math.max(1, lastI - firstI);
  const xFor = i => mL + ((i - firstI)/spanI)*plotW;
  const yFor = v => mT + plotH - ((v-yMin)/(yMax-yMin||1))*plotH;
  const line = (key)=> pts.map((p,idx)=>`${idx===0?'M':'L'}${xFor(p.i).toFixed(1)},${yFor(p.v[key]).toFixed(1)}`).join(' ');

  const last = pts[pts.length-1].v;
  const gap = last.kcal - last.target;
  return `
    <section class="progress-card">
      <h2 class="panel-head">Intake trend &middot; 7-day average</h2>
      <svg viewBox="0 0 ${w} ${h}" class="trend-chart" role="img" aria-label="Seven day rolling average calories against target">
        <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${h-mB}" stroke="var(--border)"/>
        <line x1="${mL}" y1="${h-mB}" x2="${w-mR}" y2="${h-mB}" stroke="var(--border)"/>
        <text x="2" y="${mT+8}" fill="var(--text-faint)" font-size="10">${yMax.toFixed(0)}</text>
        <text x="2" y="${h-mB}" fill="var(--text-faint)" font-size="10">${yMin.toFixed(0)}</text>
        <path d="${line('target')}" fill="none" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <path d="${line('kcal')}" fill="none" stroke="var(--kcal)" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <div class="chart-caption">${pts[0].v.date} &rarr; ${pts[pts.length-1].v.date}</div>
      <div class="trend-legend">
        <span><i class="sw sw-kcal"></i>Eaten</span>
        <span><i class="sw sw-target"></i>Target</span>
        <span class="trend-gap">${Math.abs(gap) < 40 ? 'tracking on target' : (gap > 0 ? `${gap.toFixed(0)} over target` : `${Math.abs(gap).toFixed(0)} under target`)}</span>
      </div>
    </section>`;
}

/* ---- Adherence heatmap ---- */
function renderHeatmapSection(days){

  const yMin = min-pad, yMax = max+pad;
  const w=500, h=160, mL=38, mR=10, mT=10, mB=20;
  const plotW=w-mL-mR, plotH=h-mT-mB;
  const xFor = i => points.length<=1 ? mL+plotW/2 : mL + (i/(points.length-1))*plotW;
  const yFor = v => mT + plotH - ((v-yMin)/(yMax-yMin||1))*plotH;
  const pathD = points.map((p,i)=>`${i===0?'M':'L'}${xFor(i).toFixed(1)},${yFor(p.weight).toFixed(1)}`).join(' ');
  const dots = points.map((p,i)=>`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.weight).toFixed(1)}" r="3" fill="var(--kcal)"></circle>`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="weight-chart">
      <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${h-mB}" stroke="var(--border)" stroke-width="1"/>
      <line x1="${mL}" y1="${h-mB}" x2="${w-mR}" y2="${h-mB}" stroke="var(--border)" stroke-width="1"/>
      <text x="2" y="${mT+8}" fill="var(--text-muted)" font-size="9">${yMax.toFixed(1)}</text>
      <text x="2" y="${h-mB}" fill="var(--text-muted)" font-size="9">${yMin.toFixed(1)}</text>
      <path d="${pathD}" fill="none" stroke="var(--kcal)" stroke-width="2"/>
      ${dots}
    </svg>
    <div class="chart-caption">${points[0].date} &rarr; ${points[points.length-1].date} &middot; ${points[points.length-1].weight}lb latest</div>
  `;
}
function renderWeightChartSection(points){
  const withWeight = points.filter(p=>p.weight!=null);
  return `<section class="progress-card"><h2 class="panel-head">Weight &middot; last 90 days</h2>${renderWeightChart(withWeight)}</section>`;
}
function renderInBodySection(history){
  if(history.length===0){
    return `<section class="progress-card"><h2 class="panel-head">Latest InBody</h2><div class="empty-hint">No InBody data logged yet — add Body Fat % / SMM in the Today view&rsquo;s Body log.</div></section>`;
  }
  const latest = history[history.length-1];
  const prev = history.length>1 ? history[history.length-2] : null;
  const rows = [
    {label:'Weight', unit:'lb', latest:latest.weight, prev:prev?prev.weight:null},
    {label:'Body Fat %', unit:'%', latest:latest.bf, prev:prev?prev.bf:null},
    {label:'Skeletal Muscle', unit:'lb', latest:latest.smm, prev:prev?prev.smm:null},
  ].filter(r=>r.latest!=null);
  return `
    <section class="progress-card">
      <h2 class="panel-head">Latest InBody &middot; ${latest.date}${prev?` (vs ${prev.date})`:''}</h2>
      ${rows.map(r=>{
        const delta = (r.prev!=null) ? (r.latest-r.prev) : null;
        const deltaStr = delta==null ? '' : (delta>=0?'+':'')+delta.toFixed(1)+r.unit;
        return `<div class="inbody-row"><span>${r.label}</span><span class="inbody-val">${r.latest}${r.unit}</span>${delta!=null?`<span class="inbody-delta ${delta<0?'down':'up'}">${deltaStr}</span>`:'<span class="inbody-delta"></span>'}</div>`;
      }).join('')}
    </section>
  `;
}
function renderConsistencySection(c){
  const n = c.totalConsidered;
  const rows = [
    {label:'Protein target hit', val:c.proteinHit},
    {label:'Calories on target (&plusmn;10%)', val:c.calorieOnTarget},
    {label:'Lifting completed', val:c.liftingDays},
    {label:'Cardio completed', val:c.cardioDays, note:'target ~4/week'},
    {label:'Yoga completed', val:c.yogaDays},
  ];
  return `
    <section class="progress-card">
      <h2 class="panel-head">Consistency &middot; last 30 days (${n}/30 logged)</h2>
      ${rows.map(r=>`<div class="consistency-row"><span>${r.label}${r.note?` <span class="consistency-note">(${r.note})</span>`:''}</span><span class="consistency-val">${r.val}/${n}</span></div>`).join('')}
    </section>
  `;
}

/* ---- Swipe left/right to move between days ----
   A horizontal drag is the natural gesture for a date-indexed screen; the
   thresholds keep it from firing on vertical scrolls or stray taps. */
function attachSwipeNavigation(){
  const app = document.getElementById('app');
  if(!app || app.dataset.swipeBound === '1') return;
  app.dataset.swipeBound = '1';

  let x0 = null, y0 = null, t0 = 0, tracking = false, animating = false;
  const THRESHOLD = 60;

  const hint = document.createElement('div');
  hint.className = 'swipe-hint';
  hint.innerHTML = '<span class="swipe-hint-label"></span>';
  document.body.appendChild(hint);

  const setHint = (dx)=>{
    const commit = Math.abs(dx) >= THRESHOLD;
    const d = new Date(currentDate);
    d.setDate(d.getDate() + (dx < 0 ? 1 : -1));
    hint.querySelector('.swipe-hint-label').textContent =
      (dx < 0 ? '' : '\u2039 ') + d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}) + (dx < 0 ? ' \u203a' : '');
    hint.className = 'swipe-hint visible' + (commit ? ' commit' : '') + (dx < 0 ? ' left' : ' right');
    hint.style.opacity = String(Math.min(1, Math.abs(dx) / THRESHOLD));
  };
  const clearHint = ()=>{ hint.className = 'swipe-hint'; hint.style.opacity = ''; };

  // The element that actually moves during a drag/animation. Chrome (bottom
  // nav, FAB) lives outside it and never participates.
  const dragTarget = ()=> document.getElementById('swipePane') || app;

  // Cancelled drag: spring back to center. This part was never the problem.
  const springBack = ()=>{
    const el = dragTarget();
    el.style.transition = 'transform .22s var(--ease)';
    el.style.transform = '';
    setTimeout(()=>{ if(!animating) el.style.transition = ''; }, 240);
  };

  // Committed drag: prefetch the target day's data and pre-build its markup
  // BEFORE moving a single pixel, then run one continuous animation where the
  // outgoing and incoming panes slide together as a pair. Because both panes
  // are real, already-rendered DOM sitting side by side inside an
  // overflow:hidden stage, there is no frame where the stage shows nothing --
  // no fetch-then-jump-cut gap, no dead time waiting on render().
  async function animateToDay(direction){
    const stage = document.getElementById('swipeStage');
    const outgoingPane = document.getElementById('swipePane');
    if(!stage || !outgoingPane){ currentDate.setDate(currentDate.getDate() + direction); render(); return; }

    animating = true;
    const stageWidth = stage.getBoundingClientRect().width || 390;

    const targetDate = new Date(currentDate);
    targetDate.setDate(targetDate.getDate() + direction);
    const targetKey = dateStr(targetDate);

    // All async work happens up front, while the screen is still perfectly
    // still showing the outgoing day -- nothing to see is ever mid-fetch.
    const [day, weekly] = await Promise.all([
      getOrInitDay(targetKey, targetDate),
      computeWeeklyAverage(),
    ]);
    const incomingHTML = buildDayPaneHTML(targetDate, day, weekly);
    // Commit the date now: everything needed to paint the outgoing pane was
    // already captured in its existing DOM, and nothing else reads
    // currentDate until this gesture is long finished.
    currentDate = targetDate;

    if(prefersReducedMotion()){
      outgoingPane.innerHTML = incomingHTML;
      attachBodyLogEvents();
      if(modalState) attachModalEvents();
      animating = false;
      return;
    }

    // Lock the stage's height across the transition -- the two days can have
    // a different number of meals, and overflow:hidden must not clip whichever
    // is taller mid-slide.
    stage.style.height = outgoingPane.offsetHeight + 'px';

    const incomingPane = document.createElement('div');
    incomingPane.className = 'swipe-pane';
    incomingPane.style.cssText = `position:absolute;top:0;left:0;width:100%;transform:translateX(${direction * stageWidth}px);`;
    incomingPane.innerHTML = incomingHTML;
    stage.appendChild(incomingPane);
    stage.style.height = Math.max(outgoingPane.offsetHeight, incomingPane.offsetHeight) + 'px';
    outgoingPane.style.cssText = 'position:absolute;top:0;left:0;width:100%;';
    void stage.offsetWidth; // commit starting transforms before animating

    const dur = 260, easing = 'cubic-bezier(.22,.61,.36,1)';
    const outAnim = outgoingPane.animate(
      [{transform:'translateX(0)'}, {transform:`translateX(${-direction * stageWidth}px)`}],
      {duration:dur, easing, fill:'forwards'});
    const inAnim = incomingPane.animate(
      [{transform:`translateX(${direction * stageWidth}px)`}, {transform:'translateX(0)'}],
      {duration:dur, easing, fill:'forwards'});
    await Promise.all([outAnim.finished, inAnim.finished]);

    // Promote the incoming pane to be the live one and drop the old one.
    incomingPane.id = 'swipePane';
    incomingPane.style.cssText = '';
    outgoingPane.remove();
    stage.style.height = '';

    attachBodyLogEvents();
    if(modalState) attachModalEvents();
    animating = false;
  }

  app.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1 || animating) return;
    if(currentView !== 'today' || modalState || importPendingData) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); tracking = false;
  }, {passive:true});

  app.addEventListener('touchmove', (e)=>{
    if(x0 === null) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    // Only claim the gesture once it's clearly horizontal, so scrolling is unaffected.
    if(!tracking){
      if(Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ x0 = null; return; }
      if(Math.abs(dx) < 12) return;
      tracking = true;
    }
    // Rubber-band the day's content so the drag feels attached to the finger;
    // the nav bar and FAB hold still throughout.
    const damped = Math.sign(dx) * Math.min(Math.abs(dx) * 0.45, 48);
    dragTarget().style.transform = `translateX(${damped.toFixed(1)}px)`;
    setHint(dx);
  }, {passive:true});

  app.addEventListener('touchend', (e)=>{
    if(x0 === null){ clearHint(); return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    x0 = null; y0 = null;
    clearHint();
    const committed = tracking && dt <= 600 && Math.abs(dx) >= THRESHOLD && Math.abs(dy) <= 45;
    if(committed){
      vibrate(8);
      animateToDay(dx < 0 ? 1 : -1);
    }else{
      springBack();
    }
  }, {passive:true});

  app.addEventListener('touchcancel', ()=>{ x0 = null; clearHint(); if(!animating) springBack(); }, {passive:true});
}

/* ===================== TOP-LEVEL EVENT DELEGATION ===================== */
document.getElementById('app').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const key = dateStr(currentDate);
  const action = el.dataset.action;
  if(action==='switch-view'){ switchView(el.dataset.view); }
  else if(action==='prev-day'){ currentDate.setDate(currentDate.getDate()-1); render(); }
  else if(action==='next-day'){ currentDate.setDate(currentDate.getDate()+1); render(); }
  else if(action==='go-today'){ currentDate = new Date(); render(); }
  else if(action==='reset-day'){ resetDay(key, currentDate); }
  else if(action==='backup'){ downloadBackup(); }
  else if(action==='delete-food'){ deleteCustomFood(el.dataset.id); }
  else if(action==='edit-food'){ openFoodEditor(el.dataset.id); }
  else if(action==='edit-plan'){ planEditType = el.dataset.type; currentView='planedit'; render(); }
  else if(action==='close-plan-editor'){ currentView='settings'; render(); }
  else if(action==='add-plan-meal'){ openPlanMealModal(null); }
  else if(action==='edit-plan-meal'){ openPlanMealModal(parseInt(el.dataset.idx,10)); }
  else if(action==='delete-plan-meal'){ deletePlanMeal(parseInt(el.dataset.idx,10)); }
  else if(action==='copy-yesterday'){
    const y = new Date(currentDate); y.setDate(y.getDate()-1);
    copyDayFrom(y).then(okd=>{ if(!okd) offerUndo('Nothing logged the day before', null); });
  }
  else if(action==='use-saved-meal'){ useSavedMeal(el.dataset.id); }
  else if(action==='delete-saved-meal'){ deleteSavedMeal(el.dataset.id); }
  else if(action==='save-meal-reuse'){
    if(modalState){
      saveMealForReuse(modalState.name.trim() || 'Saved meal', modalState.items, modalState.manualMacros);
      const btn = document.getElementById('saveReuseBtn');
      if(btn){ btn.textContent = 'Saved for reuse'; btn.disabled = true; }
    }
  }
  else if(action==='delete-weighin'){ deleteWeighIn(el.dataset.date); }
  else if(action==='apply-adaptive'){
    const kcal = clamp0(parseFloat(el.dataset.kcal));
    if(kcal > 0){
      // Switching to explicit targets: seed from what's effective now so only
      // calories move, then override the calorie figure.
      const t = targetFor('training'), r = targetFor('rest');
      meta.profile.targets = { training:{...t}, rest:{...r} };
      meta.profile.targetsMode = 'manual';
      meta.profile.targets.training.kcal = kcal;
      meta.profile.targets.rest.kcal = kcal;
      persistMeta();
      offerUndo('Calorie target updated', async ()=>{
        meta.profile.targets.training.kcal = t.kcal;
        meta.profile.targets.rest.kcal = r.kcal;
        await persistMeta();
        render();
      });
      render();
    }
  }
  else if(action==='rerun-onboarding'){ meta.profile.onboarded=false; persistMeta(); onboardState=null; render(); }
  else if(action==='import'){ document.getElementById('importFileInput').click(); }
  else if(action==='toggle-check'){ toggleChecked(key, el.dataset.id); }
  else if(action==='toggle-lifting'){ toggleTraining(key, 'liftingDone'); }
  else if(action==='toggle-cardio'){ toggleTraining(key, 'cardioDone'); }
  else if(action==='toggle-yoga'){ toggleTraining(key, 'yogaDone'); }
  else if(action==='add-water'){ addWater(key, parseFloat(el.dataset.ml)); }
  else if(action==='water-clear'){ clearWater(key); }
  else if(action==='delete-meal'){ deleteMeal(key, el.dataset.id); }
  else if(action==='edit-meal'){ openEditMeal(el.dataset.id); }
  else if(action==='open-add-meal'){
    // Brief press feedback on the button before the sheet arrives, so the
    // transition reads as one motion rather than an abrupt swap.
    if(el.classList.contains('fab')){
      el.classList.add('fab-press');
      setTimeout(()=>el.classList.remove('fab-press'), 220);
    }
    vibrate(10);
    openAddMeal();
  }
});
document.getElementById('app').addEventListener('change', (e)=>{
  if(e.target.id==='datePicker'){
    const parts = e.target.value.split('-').map(Number);
    if(parts.length===3 && !parts.some(isNaN)){
      currentDate = new Date(parts[0], parts[1]-1, parts[2]);
      render();
    }
  }
});


/* ===================== PWA: install, offline, shortcuts ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* not available in this context (e.g. file://) — app still works, just without offline caching */ });
  });
}

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function showInstallBanner(kind){
  const el = document.getElementById('installBanner');
  if(!el || isStandalone() || localStorage.getItem('installBannerDismissed')==='1') return;
  if(kind === 'android'){
    el.innerHTML = `
      <div class="install-title">Install Recomp Tracker</div>
      <div class="install-body">Add it to your home screen for a full-screen app with offline support.</div>
      <div class="install-actions">
        <button type="button" class="install-dismiss" id="installDismissBtn">Not now</button>
        <button type="button" class="install-primary" id="installNowBtn">Install</button>
      </div>`;
  }else{
    el.innerHTML = `
      <div class="install-title">Install Recomp Tracker</div>
      <div class="install-body">Tap the Share icon below, then "Add to Home Screen" for a full-screen app with offline support.</div>
      <div class="install-actions">
        <button type="button" class="install-dismiss" id="installDismissBtn">Got it</button>
      </div>`;
  }
  el.className = 'install-banner visible';
  document.getElementById('installDismissBtn').addEventListener('click', ()=>{
    el.className = 'install-banner';
    try{ localStorage.setItem('installBannerDismissed','1'); }catch(e){}
  });
  const nowBtn = document.getElementById('installNowBtn');
  if(nowBtn) nowBtn.addEventListener('click', async ()=>{
    if(window.__deferredInstallPrompt){
      window.__deferredInstallPrompt.prompt();
      try{ await window.__deferredInstallPrompt.userChoice; }catch(e){}
    }
    el.className = 'install-banner';
  });
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  window.__deferredInstallPrompt = e;
  showInstallBanner('android');
});
if(isIOS() && !isStandalone()){
  setTimeout(()=>showInstallBanner('ios'), 1200);
}

function handleShortcutAction(){
  // Shortcuts must not fire over the setup flow — the app has no plan or
  // targets yet, so opening the add-meal modal there would be meaningless.
  if(meta && meta.profile && !meta.profile.onboarded) return;
  const params = new URLSearchParams(window.location.search);
  const action = params.get('action');
  if(action === 'addmeal'){ openAddMeal(); }
  else if(action === 'logweight'){
    setTimeout(()=>{ const el = document.getElementById('bodyWeight'); if(el) el.focus(); }, 100);
  }
}

/* ===================== INIT ===================== */
(async function init(){
  try{
    loadBundledFoodDb();
    const loadedMeta = await loadDataKey(META_KEY);
    const result = migrateMeta(loadedMeta);
    meta = result.meta;
    // Persist the migrated shape immediately so the upgrade happens once, not on
    // every load — and so a later failure can't leave storage half-migrated.
    if(result.migrated) await persistMeta();
    render();
    attachSwipeNavigation();
    handleShortcutAction();
  }catch(err){
    meta = meta || createDefaultMeta();
    renderErrorBoundary(err);
  }
})();
</script>
