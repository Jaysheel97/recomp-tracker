<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recomp Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#15171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp">
<style>
:root{
  --bg:#15171b; --surface:#1e2126; --surface-2:#262a31; --border:#33383f;
  --text:#ededea; --text-muted:#8a8f98;
  --training:#e4572e; --training-dim:rgba(228,87,46,.14);
  --rest:#5b8aa6; --rest-dim:rgba(91,138,166,.14);
  --protein:#4fa37d; --carbs:#d9a441; --fat:#b97bc4; --kcal:#f0dfc0;
  --danger:#d9534f;
  --font-serif:ui-serif,'Iowan Old Style','Palatino Linotype',Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:var(--font-sans);}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--training);outline-offset:2px;}
.app{max-width:560px;margin:0 auto;padding:16px 16px 72px;min-height:100vh;}

.brand-strip{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--text-muted);text-align:center;margin-bottom:14px;text-transform:uppercase;}
.loading-state{text-align:center;padding:90px 20px;color:var(--text-muted);font-family:var(--font-mono);}

/* Header */
.app-header{padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.date-nav{display:flex;align-items:center;justify-content:center;gap:16px;}
.nav-btn{background:none;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;transition:background .15s,border-color .15s;line-height:1;}
.nav-btn:hover{background:var(--surface-2);}
.date-display{text-align:center;position:relative;min-width:190px;}
.date-label{font-family:var(--font-serif);font-size:20px;font-weight:600;letter-spacing:.2px;}
.date-picker{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;border:none;}
.header-row2{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
.pill{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:999px;font-weight:600;}
.pill-training{background:var(--training-dim);color:var(--training);border:1px solid var(--training);}
.pill-rest{background:var(--rest-dim);color:var(--rest);border:1px solid var(--rest);}
.link-btn{background:none;border:none;color:var(--text-muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:2px 4px;}
.link-btn:hover{color:var(--text);}

/* Macro panel */
.macro-panel{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.macro-panel.training{border-top-color:var(--training);}
.macro-panel.rest{border-top-color:var(--rest);}
.macro-row{display:grid;grid-template-columns:66px 1fr auto;align-items:center;gap:12px;margin-bottom:14px;}
.macro-row:last-of-type{margin-bottom:8px;}
.macro-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
.macro-bar-track{position:relative;height:10px;background:var(--surface-2);border-radius:6px;}
.macro-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;transition:width .4s ease;}
.macro-bar-marker{position:absolute;top:-3px;width:2px;height:16px;background:var(--text-muted);border-radius:1px;}
.macro-value{font-family:var(--font-mono);font-size:13px;text-align:right;min-width:96px;}
.macro-value.over{color:var(--training);}
.plan-footnote{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}

/* Weekly panel */
.weekly-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;}
.weekly-head{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;margin-bottom:10px;}
.weekly-logged{font-family:var(--font-mono);text-transform:none;letter-spacing:0;}
.weekly-rows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.weekly-row{display:flex;flex-direction:column;gap:2px;}
.weekly-row span:first-child{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
.weekly-val{font-family:var(--font-mono);font-size:13px;}
.weekly-target{color:var(--text-muted);font-size:11px;}

/* Meal list */
.meal-list{display:flex;flex-direction:column;gap:10px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);border:1px dashed var(--border);border-radius:var(--radius);}
.meal-card{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;transition:border-color .2s;}
.meal-card.checked{border-color:var(--protein);}
.meal-card.checked .meal-name{opacity:.85;}
.check-toggle{background:none;border:none;padding:0;cursor:pointer;flex-shrink:0;margin-top:2px;}
.check-box{display:block;width:22px;height:22px;border-radius:6px;border:2px solid var(--border);transition:all .15s;position:relative;}
.meal-card.checked .check-box{background:var(--protein);border-color:var(--protein);}
.meal-card.checked .check-box::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg);}
.meal-info{flex:1;min-width:0;}
.meal-name{font-family:var(--font-serif);font-weight:600;font-size:15px;margin-bottom:3px;}
.meal-macros{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);}
.meal-items{margin-top:8px;font-size:12px;}
.meal-items summary{color:var(--text-muted);cursor:pointer;}
.meal-items ul{margin:6px 0 0;padding-left:18px;color:var(--text-muted);}
.meal-actions{display:flex;flex-direction:column;gap:6px;}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text-muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;}
.icon-btn:hover{color:var(--text);border-color:var(--text-muted);}
.add-meal-btn{background:none;border:1px dashed var(--border);color:var(--text-muted);padding:12px;border-radius:var(--radius);cursor:pointer;font-size:14px;margin-top:4px;width:100%;transition:all .15s;}
.add-meal-btn:hover{border-color:var(--text);color:var(--text);}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,11,13,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-head h3{font-family:var(--font-serif);margin:0;font-size:18px;}
.field-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin:14px 0 6px;}
.text-input, select.text-input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;}

/* Tabs */
.tab-row{display:flex;gap:8px;margin-bottom:4px;}
.tab-btn{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.tab-btn.active{background:var(--protein);color:#0e1410;border-color:var(--protein);}

.ing-results{max-height:160px;overflow-y:auto;margin-top:8px;border:1px solid var(--border);border-radius:8px;}
.ing-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;gap:8px;}
.ing-row:last-child{border-bottom:none;}
.ing-name{flex:1;min-width:0;}
.ing-source-tag{font-size:9px;color:var(--rest);border:1px solid var(--rest);border-radius:4px;padding:1px 4px;margin-left:6px;text-transform:uppercase;}
.ing-meta{font-family:var(--font-mono);color:var(--text-muted);font-size:11px;white-space:nowrap;}
.ing-row button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;flex-shrink:0;}
.ing-row button:hover{border-color:var(--protein);color:var(--protein);}
.new-food-toggle{background:none;border:none;color:var(--rest);font-size:12px;text-decoration:underline;cursor:pointer;padding:8px 2px;display:block;}
.new-food-form{border:1px dashed var(--rest);border-radius:10px;padding:12px;margin-top:8px;background:var(--rest-dim);}
.macro-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.macro-input-grid label{font-size:10px;color:var(--text-muted);display:block;margin-bottom:3px;}
.lookup-row{display:flex;gap:8px;margin-top:8px;align-items:flex-start;}
.lookup-row .text-input{flex:1;}
.lookup-btn{background:var(--rest);color:#0e1720;border:1px solid var(--rest);border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.lookup-btn:disabled{opacity:.6;cursor:wait;}
.lookup-status{font-size:12px;color:var(--text-muted);margin-top:6px;min-height:16px;}
.lookup-status.error{color:var(--training);}
.hint-text{font-size:11px;color:var(--text-muted);margin-top:6px;}

.selected-head{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;}
.selected-list{display:flex;flex-direction:column;gap:6px;}
.sel-row{display:grid;grid-template-columns:1fr 56px auto 64px auto;align-items:center;gap:6px;background:var(--surface-2);padding:8px 10px;border-radius:8px;}
.sel-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qty-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 6px;border-radius:6px;font-family:var(--font-mono);font-size:13px;}
.sel-unit{font-size:10px;color:var(--text-muted);white-space:nowrap;}
.sel-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:right;white-space:nowrap;}
.remove-btn{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:0 4px;}
.remove-btn:hover{color:var(--danger);}
.modal-total{font-family:var(--font-mono);font-size:14px;text-align:center;padding:12px;background:var(--surface-2);border-radius:8px;margin-top:16px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn-ghost,.btn-primary{flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);}
.btn-ghost{background:none;color:var(--text-muted);}
.btn-primary{background:var(--protein);color:#0e1410;border-color:var(--protein);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.6;cursor:wait;}
.empty-hint{padding:12px;text-align:center;color:var(--text-muted);font-size:12px;}
.save-warning{color:var(--training);font-size:12px;text-align:center;margin-top:8px;display:none;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
@media (min-width:640px){.modal-backdrop{align-items:center;}.modal{border-radius:16px;}}

.save-indicator{position:fixed;bottom:16px;right:16px;left:auto;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text-muted);display:none;align-items:center;gap:8px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.35);}
.install-banner{position:fixed;left:16px;right:16px;bottom:16px;background:var(--surface);border:1px solid var(--protein);border-radius:12px;padding:14px 16px;z-index:210;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.install-banner.visible{display:block;}
.install-banner .install-title{font-family:var(--font-serif);font-weight:600;font-size:14px;margin-bottom:4px;}
.install-banner .install-body{font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:10px;}
.install-banner .install-actions{display:flex;gap:8px;}
.install-banner button{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);}
.install-banner .install-primary{background:var(--protein);color:#0e1410;border-color:var(--protein);}
.install-banner .install-dismiss{background:none;color:var(--text-muted);}
.save-indicator.visible{display:flex;}
.save-indicator.error{color:var(--training);border-color:var(--training);}
.save-indicator button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;flex-shrink:0;}

.view-tabs{display:flex;gap:8px;margin-bottom:16px;}
.view-tab{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.view-tab.active{background:var(--surface-2);color:var(--text);border-color:var(--text-muted);}
.progress-head{font-family:var(--font-serif);font-size:22px;font-weight:600;text-align:center;margin-bottom:18px;}

.body-log-panel,.training-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
.panel-head{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.body-log-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.body-log-grid label{font-size:10px;color:var(--text-muted);display:block;margin-bottom:4px;}
.training-row{display:flex;gap:10px;}
.toggle-pill{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);padding:10px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;}
.toggle-pill.active{background:var(--protein);color:#0e1410;border-color:var(--protein);}

.progress-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
.weight-chart{width:100%;height:auto;display:block;}
.chart-caption{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:center;margin-top:8px;}
.inbody-row,.consistency-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.inbody-row:last-child,.consistency-row:last-child{border-bottom:none;}
.inbody-val,.consistency-val{font-family:var(--font-mono);}
.inbody-delta{font-family:var(--font-mono);font-size:11px;min-width:48px;text-align:right;}
.inbody-delta.up{color:var(--carbs);}
.inbody-delta.down{color:var(--rest);}
.consistency-note{color:var(--text-muted);font-size:11px;font-weight:400;}

</style>
</head>
<body>
<div class="app" id="app"><div class="loading-state">Loading your plan&hellip;</div></div>
<div class="save-indicator" id="saveIndicator" aria-live="polite"></div>
<div class="install-banner" id="installBanner"></div>

<script>
/* ===================== BUILT-IN INGREDIENT DATABASE ===================== */
const INGREDIENTS = [
  {id:'tofu', name:'House Foods Extra Firm Tofu', unit:'g', per:100, unitLabel:'g', kcal:82.35, p:8.24, c:2.35, f:5.88},
  {id:'tortilla', name:'Mission Carb Balance Tortilla', unit:'piece', per:1, unitLabel:'tortilla', kcal:70, p:6, c:17, f:2.5},
  {id:'banana', name:'Large Banana', unit:'piece', per:1, unitLabel:'banana', kcal:121, p:1.5, c:31, f:0.4},
  {id:'pepponion', name:'Sautéed Peppers & Onion', unit:'serving', per:1, unitLabel:'serving', kcal:45, p:1.5, c:10, f:0.3},
  {id:'yogurt', name:'Kirkland 0% Greek Yogurt', unit:'g', per:100, unitLabel:'g', kcal:58.8, p:10, c:3.5, f:0},
  {id:'almondmilk', name:'365 Unsweetened Almond Milk', unit:'cup', per:1, unitLabel:'cup', kcal:40, p:1, c:2, f:3},
  {id:'blackbeans', name:'Black Beans (canned)', unit:'g', per:100, unitLabel:'g', kcal:91, p:5.9, c:16.6, f:0.4},

  {id:'oliveoil', name:'Olive Oil', unit:'tsp', per:1, unitLabel:'tsp', kcal:40, p:0, c:0, f:4.5},
  {id:'tacoseasoning', name:'Taco Seasoning', unit:'serving', per:1, unitLabel:'serving', kcal:5, p:0.2, c:1, f:0.1},
  {id:'chipotleseasoning', name:'Chipotle Seasoning', unit:'serving', per:1, unitLabel:'serving', kcal:10, p:0.3, c:2, f:0},
  {id:'whey', name:'ON Gold Standard Whey', unit:'scoop', per:1, unitLabel:'scoop', kcal:120, p:24, c:3, f:1},
  {id:'oats', name:'Dry Rolled Oats', unit:'g', per:100, unitLabel:'g', kcal:389, p:16.9, c:66.3, f:6.9},
  {id:'eggwhite', name:'Egg White (large)', unit:'piece', per:1, unitLabel:'egg white', kcal:17, p:3.6, c:0.2, f:0.05},
  {id:'wholeegg', name:'Whole Egg (large)', unit:'piece', per:1, unitLabel:'egg', kcal:72, p:6.3, c:0.36, f:4.8},
  {id:'date', name:'Medjool Date', unit:'piece', per:1, unitLabel:'date', kcal:66, p:0.4, c:18, f:0},
  {id:'sriracha', name:'TJ Sriracha', unit:'tbsp', per:1, unitLabel:'tbsp', kcal:10, p:0, c:2, f:0},
  {id:'dkbread', name:"Dave's Killer Bread", unit:'piece', per:1, unitLabel:'slice', kcal:110, p:5, c:22, f:2},
  {id:'apple', name:'Medium Apple', unit:'piece', per:1, unitLabel:'apple', kcal:95, p:0.5, c:25, f:0.3},
  {id:'almond', name:'Almond', unit:'piece', per:1, unitLabel:'almond', kcal:7, p:0.26, c:0.26, f:0.6},
  {id:'fishoil', name:'Fish Oil 1200mg', unit:'piece', per:1, unitLabel:'softgel', kcal:11, p:0, c:0, f:1.2},
  {id:'vitacraves', name:'VitaCraves Gummy', unit:'piece', per:1, unitLabel:'gummy', kcal:7.5, p:0, c:2, f:0},
  {id:'cottagecheese', name:'Low-Fat Cottage Cheese', unit:'g', per:100, unitLabel:'g', kcal:80, p:11.1, c:3.56, f:2.22},
  {id:'blueberries', name:'Blueberries', unit:'g', per:100, unitLabel:'g', kcal:57, p:0.77, c:14.5, f:0.31},
];

/* ===================== MEAL TEMPLATES ===================== */
const BREAKFAST_ITEMS = [
  {ing:'eggwhite',qty:4},{ing:'wholeegg',qty:1},{ing:'oats',qty:80},
  {ing:'almondmilk',qty:1},{ing:'date',qty:2.5},{ing:'yogurt',qty:40},
  {ing:'sriracha',qty:1},{ing:'dkbread',qty:2},{ing:'apple',qty:1},{ing:'almond',qty:5}
];
const LUNCH_ITEMS = [
  {ing:'tofu',qty:200},{ing:'oliveoil',qty:1},{ing:'tacoseasoning',qty:1},
  {ing:'rice',qty:100},{ing:'blackbeans',qty:100},{ing:'yogurt',qty:30},{ing:'pepponion',qty:1}
];
const SUPPLEMENTS_ITEMS = [ {ing:'fishoil',qty:2},{ing:'vitacraves',qty:2} ];
const DINNER_ITEMS = [
  {ing:'tofu',qty:200},{ing:'chipotleseasoning',qty:1},{ing:'blackbeans',qty:100},
  {ing:'tortilla',qty:1},{ing:'yogurt',qty:30},{ing:'pepponion',qty:1}
];
const PRESLEEP_ITEMS = [ {ing:'cottagecheese',qty:225},{ing:'blueberries',qty:65} ];

const TRAINING_TEMPLATE = [
  {id:'breakfast', name:'Breakfast + Snacks', items:BREAKFAST_ITEMS},
  {id:'lunch', name:'Lunch — Tofu Rice & Beans Bowl', items:LUNCH_ITEMS},
  {id:'supplements', name:'Supplements', items:SUPPLEMENTS_ITEMS},
  {id:'preworkout', name:'Pre-Workout', items:[{ing:'banana',qty:1}]},
  {id:'postworkout', name:'Post-Workout', items:[{ing:'whey',qty:1},{ing:'banana',qty:1},{ing:'oats',qty:35}]},
  {id:'dinner', name:'Dinner — Chipotle Tofu Wrap', items:DINNER_ITEMS},
  {id:'presleep', name:'Pre-Sleep', items:PRESLEEP_ITEMS},
];
const REST_TEMPLATE = [
  {id:'breakfast', name:'Breakfast + Snacks', items:BREAKFAST_ITEMS},
  {id:'lunch', name:'Lunch — Tofu Rice & Beans Bowl', items:LUNCH_ITEMS},
  {id:'supplements', name:'Supplements', items:SUPPLEMENTS_ITEMS},
  {id:'middayprotein', name:'Midday Protein', items:[{ing:'whey',qty:1}]},
  {id:'dinner', name:'Dinner — Chipotle Tofu Wrap', items:DINNER_ITEMS},
  {id:'presleep', name:'Pre-Sleep', items:PRESLEEP_ITEMS},
];

/* ===================== CUSTOM FOODS (user-added, persisted separately) ===================== */
let meta = { customFoods: [] };
function allIngredients(){ return INGREDIENTS.concat(meta.customFoods); }
function ingredientById(id){ return allIngredients().find(i=>i.id===id); }

/* ===================== MACRO MATH ===================== */
function itemMacros(item){
  const ing = ingredientById(item.ing);
  if(!ing) return {kcal:0,p:0,c:0,f:0};
  const factor = item.qty / ing.per;
  return {kcal:ing.kcal*factor, p:ing.p*factor, c:ing.c*factor, f:ing.f*factor};
}
function mealMacros(meal){
  if(meal.manualMacros) return {kcal:meal.manualMacros.kcal, p:meal.manualMacros.p, c:meal.manualMacros.c, f:meal.manualMacros.f};
  return meal.items.reduce((acc,item)=>{
    const m = itemMacros(item);
    acc.kcal+=m.kcal; acc.p+=m.p; acc.c+=m.c; acc.f+=m.f;
    return acc;
  }, {kcal:0,p:0,c:0,f:0});
}
function dayTotals(meals){
  return meals.reduce((acc,meal)=>{
    const m = mealMacros(meal);
    acc.kcal+=m.kcal; acc.p+=m.p; acc.c+=m.c; acc.f+=m.f;
    return acc;
  }, {kcal:0,p:0,c:0,f:0});
}
function checkedTotals(meals){ return dayTotals(meals.filter(m=>m.checked)); }
function dayHasAnyChecked(meals){ return meals.some(m=>m.checked); }

const TRAINING_TARGET = dayTotals(TRAINING_TEMPLATE);
const REST_TARGET = dayTotals(REST_TEMPLATE);

/* ===================== DATE HELPERS ===================== */
function dateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isWeekend(d){ const day=d.getDay(); return day===0||day===6; }
function dayTypeFor(d){ return isWeekend(d) ? 'rest' : 'training'; }
function formatDateLabel(d){ return d.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'}); }
function monthKeyFor(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

/* ===================== STORAGE (hybrid: Claude artifact storage, else localStorage) ===================== */
/* Storage calls can fail transiently. We retry quietly with backoff before surfacing
   anything, and never use console.error for expected, handled failures. */
const hasClaudeStorage = (typeof window.storage !== 'undefined');
const META_KEY = 'dietTracker:meta';
function monthStorageKey(mk){ return `dietTracker:days:${mk}`; }
function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function saveDataKey(key, value){
  const json = JSON.stringify(value);
  if(hasClaudeStorage){
    for(let attempt=0; attempt<3; attempt++){
      try{
        const result = await window.storage.set(key, json, false);
        if(result) return true;
      }catch(e){ /* transient — retry below */ }
      if(attempt < 2) await wait(400 * (attempt+1));
    }
    return false;
  }else{
    try{ localStorage.setItem(key, json); return true; }
    catch(e){ return false; }
  }
}
async function loadDataKey(key){
  if(hasClaudeStorage){
    for(let attempt=0; attempt<3; attempt++){
      try{
        const res = await window.storage.get(key, false);
        return res ? JSON.parse(res.value) : null;
      }catch(e){ /* transient — retry below */ }
      if(attempt < 2) await wait(400 * (attempt+1));
    }
    return null;
  }else{
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
}
async function listMonthKeys(){
  if(hasClaudeStorage){
    try{
      const res = await window.storage.list('dietTracker:days:', false);
      return res ? res.keys : [];
    }catch(e){ return []; }
  }else{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('dietTracker:days:')) keys.push(k);
    }
    return keys;
  }
}

/* ===================== APP STATE ===================== */
let monthCache = {};        // monthKey -> { dateKey: dayObject }
let monthLoadPromises = {}; // monthKey -> in-flight load promise (avoid duplicate fetches)
let currentDate = new Date();
let modalState = null;
let saveStatus = 'idle'; // 'idle' | 'saving' | 'saved' | 'error'
let saveStatusTimer = null;
let renderToken = 0;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clamp0(n){ return Math.max(0, isFinite(n) ? n : 0); }
function formatQty(item){
  const ing = ingredientById(item.ing);
  if(!ing) return `${item.qty}`;
  const q = item.qty;
  if(ing.unit==='g') return `${q}g`;
  if(ing.unit==='tsp'||ing.unit==='tbsp') return `${q} ${ing.unitLabel}`;
  const plural = q!==1 ? 's' : '';
  return `${q} ${ing.unitLabel}${plural}`;
}
function ingredientMetaLabel(ing){
  const perLabel = ing.unit==='g' ? `${ing.per}g` : `1 ${ing.unitLabel}`;
  return `${Math.round(ing.kcal)} kcal / ${perLabel}`;
}
function cloneTemplate(tpl){
  return tpl.map(m=>({id:m.id, name:m.name, checked:false, items:m.items.map(i=>({...i})), manualMacros:null}));
}

/* ---- Month-sharded day storage ---- */
async function ensureMonthLoaded(mk){
  if(monthCache[mk]) return monthCache[mk];
  if(monthLoadPromises[mk]) return monthLoadPromises[mk];
  monthLoadPromises[mk] = (async ()=>{
    const data = await loadDataKey(monthStorageKey(mk));
    monthCache[mk] = data || {};
    delete monthLoadPromises[mk];
    return monthCache[mk];
  })();
  return monthLoadPromises[mk];
}
async function persistToKey(key, value){
  saveStatus = 'saving'; updateSaveIndicator();
  const ok = await saveDataKey(key, value);
  saveStatus = ok ? 'saved' : 'error'; updateSaveIndicator();
  if(ok){
    clearTimeout(saveStatusTimer);
    saveStatusTimer = setTimeout(()=>{ if(saveStatus==='saved'){ saveStatus='idle'; updateSaveIndicator(); } }, 1500);
  }
  return ok;
}
async function persistMonth(mk){ return persistToKey(monthStorageKey(mk), monthCache[mk]); }
async function persistMeta(){ return persistToKey(META_KEY, meta); }

function updateSaveIndicator(){
  const el = document.getElementById('saveIndicator');
  if(!el) return;
  if(saveStatus==='saving'){ el.className='save-indicator visible'; el.innerHTML='Saving&hellip;'; }
  else if(saveStatus==='saved'){ el.className='save-indicator visible'; el.innerHTML='Saved'; }
  else if(saveStatus==='error'){
    el.className='save-indicator visible error';
    el.innerHTML='Couldn&rsquo;t save that change. <button type="button" id="retrySaveBtn">Retry</button>';
    const btn = document.getElementById('retrySaveBtn');
    if(btn) btn.addEventListener('click', ()=>{ persistMonth(monthKeyFor(currentDate)); });
  }else{ el.className='save-indicator'; el.innerHTML=''; }
}

async function getOrInitDay(key, date){
  const mk = monthKeyFor(date);
  const month = await ensureMonthLoaded(mk);
  if(!month[key]){
    const type = dayTypeFor(date);
    const tpl = type==='training' ? TRAINING_TEMPLATE : REST_TEMPLATE;
    month[key] = {type, meals: cloneTemplate(tpl)};
    persistMonth(mk);
  }
  return month[key];
}
async function peekDay(date){
  const mk = monthKeyFor(date);
  const month = await ensureMonthLoaded(mk);
  const key = dateStr(date);
  if(month[key]) return month[key];
  const type = dayTypeFor(date);
  const tpl = type==='training' ? TRAINING_TEMPLATE : REST_TEMPLATE;
  return {type, meals: cloneTemplate(tpl)};
}
function resetDay(key, date){
  const mk = monthKeyFor(date);
  const type = dayTypeFor(date);
  const tpl = type==='training' ? TRAINING_TEMPLATE : REST_TEMPLATE;
  monthCache[mk][key] = {type, meals:cloneTemplate(tpl)};
  persistMonth(mk); render();
}
function vibrate(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
function toggleChecked(key, mealId){
  const mk = monthKeyFor(currentDate);
  const day = monthCache[mk][key];
  const meal = day.meals.find(m=>m.id===mealId);
  if(meal){ meal.checked = !meal.checked; vibrate(12); persistMonth(mk); render(); }
}
function deleteMeal(key, mealId){
  const mk = monthKeyFor(currentDate);
  const day = monthCache[mk][key];
  day.meals = day.meals.filter(m=>m.id!==mealId);
  persistMonth(mk); render();
}
function saveMealEntry(key, mealId, name, items, manualMacros){
  const mk = monthKeyFor(currentDate);
  const day = monthCache[mk][key];
  if(mealId){
    const meal = day.meals.find(m=>m.id===mealId);
    if(meal){ meal.name=name; meal.items=items; meal.manualMacros=manualMacros||null; }
  }else{
    day.meals.push({id:'meal-'+Date.now(), name, items, manualMacros: manualMacros||null, checked:false});
  }
  persistMonth(mk); render();
}

/* ---- Weekly (7-day) rolling average, always anchored to the real "today" ---- */
async function computeWeeklyAverage(){
  const anchor = new Date();
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(anchor); d.setDate(d.getDate()-i);
    days.push(await peekDay(d));
  }
  const totals = {kcal:0,p:0,c:0,f:0};
  const targetTotals = {kcal:0,p:0,c:0,f:0};
  let loggedCount = 0;
  for(const day of days){
    const t = checkedTotals(day.meals);
    totals.kcal+=t.kcal; totals.p+=t.p; totals.c+=t.c; totals.f+=t.f;
    const tgt = day.type==='training' ? TRAINING_TARGET : REST_TARGET;
    targetTotals.kcal+=tgt.kcal; targetTotals.p+=tgt.p; targetTotals.c+=tgt.c; targetTotals.f+=tgt.f;
    if(dayHasAnyChecked(day.meals)) loggedCount++;
  }
  return {
    avgEaten: {kcal:totals.kcal/7, p:totals.p/7, c:totals.c/7, f:totals.f/7},
    avgTarget: {kcal:targetTotals.kcal/7, p:targetTotals.p/7, c:targetTotals.c/7, f:targetTotals.f/7},
    loggedCount
  };
}

/* ---- AI macro lookup (calls Claude directly from the artifact; no API key needed) ---- */
async function aiLookupMacros(description, mode){
  const systemPrompt = mode === 'per100g'
    ? "You are a nutrition estimation assistant inside a diet-tracking app. Given a short food name, estimate its nutrition PER 100 GRAMS of the food (not per serving). Respond with ONLY a raw JSON object, no markdown fences, no prose, with exactly these keys: kcal, p, c, f (all numbers, per 100g), serving_grams (typical single-serving weight in grams, your best estimate, a number), notes (one short sentence on assumptions made). Base your estimate on standard nutrition data for common recipes and ingredients."
    : "You are a nutrition estimation assistant inside a diet-tracking app. Given a description of a meal someone ate (which may include a quantity, e.g. '250g' or 'large'), estimate the TOTAL nutrition for that entire described portion, not per 100g. Respond with ONLY a raw JSON object, no markdown fences, no prose, with exactly these keys: kcal, p, c, f (numbers, totals for the whole described meal), notes (one short sentence on assumptions made, e.g. serving size assumed if unspecified). Base your estimate on standard nutrition data for common dishes and restaurant meals.";
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:500, system:systemPrompt, messages:[{role:'user', content:description}] })
    });
    if(!resp.ok) return {ok:false, error:`Lookup service returned ${resp.status}`};
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    const cleaned = text.replace(/^```json\s*|^```\s*|```\s*$/gim,'').trim();
    const parsed = JSON.parse(cleaned);
    if(typeof parsed.kcal !== 'number') return {ok:false, error:'Unexpected response format'};
    return {ok:true, data:parsed};
  }catch(e){
    return {ok:false, error:(e && e.message) || 'Lookup failed'};
  }
}

/* ---- Backup / export ---- */
async function exportAllData(){
  const monthKeys = await listMonthKeys();
  const months = {};
  for(const k of monthKeys){
    const mk = k.replace('dietTracker:days:', '');
    months[mk] = monthCache[mk] || await loadDataKey(k);
  }
  return {exportedAt: new Date().toISOString(), meta, months};
}
async function downloadBackup(){
  const data = await exportAllData();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `diet-tracker-backup-${dateStr(new Date())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---- Import (the cross-device bridge, since window.storage isn't guaranteed
   to follow you between separate artifact instances/devices) ---- */
let importPendingData = null; // parsed, validated backup awaiting merge/replace choice

async function parseBackupFile(file){
  let text;
  try{ text = await file.text(); }catch(e){ return {ok:false, error:'Could not read that file.'}; }
  let data;
  try{ data = JSON.parse(text); }catch(e){ return {ok:false, error:"That file isn't valid JSON."}; }
  if(!data || typeof data !== 'object' || typeof data.months !== 'object' || !data.months){
    return {ok:false, error:"That doesn't look like a Recomp Tracker backup file."};
  }
  if(!data.meta || !Array.isArray(data.meta.customFoods)) data.meta = {customFoods:[]};
  return {ok:true, data};
}
function isDayMeaningfullyEmpty(day){
  if(!day) return true;
  const hasCheckedMeal = day.meals.some(m=>m.checked);
  const hasCustomMeal = day.meals.some(m=>m.id.startsWith('meal-'));
  const hasBody = day.body && (day.body.weight!=null || day.body.bf!=null || day.body.smm!=null);
  const hasTraining = day.training && (day.training.liftingDone || day.training.cardioDone);
  return !hasCheckedMeal && !hasCustomMeal && !hasBody && !hasTraining;
}
async function applyImport(data, mode){
  if(mode === 'replace'){
    monthCache = {};
    for(const mk of Object.keys(data.months)){
      monthCache[mk] = data.months[mk] || {};
      await persistMonth(mk);
    }
    meta = data.meta;
    await persistMeta();
  }else{
    for(const mk of Object.keys(data.months)){
      await ensureMonthLoaded(mk);
      const incomingDays = data.months[mk] || {};
      let changed = false;
      for(const dayKey of Object.keys(incomingDays)){
        const localDay = monthCache[mk][dayKey];
        if(isDayMeaningfullyEmpty(localDay)){
          monthCache[mk][dayKey] = incomingDays[dayKey];
          changed = true;
        }
      }
      if(changed) await persistMonth(mk);
    }
    const existingIds = new Set(meta.customFoods.map(f=>f.id));
    let addedAny = false;
    for(const food of data.meta.customFoods){
      if(!existingIds.has(food.id)){ meta.customFoods.push(food); addedAny = true; }
    }
    if(addedAny) await persistMeta();
  }
  render();
}
function renderImportModal(){
  if(!importPendingData) return '';
  const monthCount = Object.keys(importPendingData.months||{}).length;
  const foodCount = (importPendingData.meta.customFoods||[]).length;
  return `
    <div class="modal-backdrop" id="importModalBackdrop">
      <div class="modal">
        <div class="modal-head"><h3>Import backup</h3><button type="button" class="icon-btn" id="importCloseBtn">&times;</button></div>
        <p style="font-size:13px;color:var(--text-muted);line-height:1.5;">This file has ${monthCount} month${monthCount===1?'':'s'} of data and ${foodCount} custom food${foodCount===1?'':'s'}. Choose how to bring it in:</p>
        <div class="modal-actions" style="flex-direction:column;gap:8px;">
          <button type="button" class="btn-primary" id="importMergeBtn">Merge &mdash; only fill in days I don&rsquo;t already have here</button>
          <button type="button" class="btn-ghost" id="importReplaceBtn" style="border-color:var(--training);color:var(--training);">Replace all data here with this backup</button>
          <button type="button" class="btn-ghost" id="importCancelBtn">Cancel</button>
        </div>
      </div>
    </div>
  `;
}
function attachImportModalEvents(){
  const backdrop = document.getElementById('importModalBackdrop');
  if(!backdrop) return;
  const close = ()=>{ importPendingData = null; render(); };
  document.getElementById('importCloseBtn').addEventListener('click', close);
  document.getElementById('importCancelBtn').addEventListener('click', close);
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });
  document.getElementById('importMergeBtn').addEventListener('click', async ()=>{
    const data = importPendingData; importPendingData = null;
    await applyImport(data, 'merge');
  });
  document.getElementById('importReplaceBtn').addEventListener('click', async ()=>{
    if(!confirm('This replaces every day and custom food currently stored here with the backup. Continue?')) return;
    const data = importPendingData; importPendingData = null;
    await applyImport(data, 'replace');
  });
}

/* ===================== RENDER: MACRO PANEL ===================== */
function renderMacroRow(r){
  const pctEaten = Math.min(100, r.target>0 ? (r.eaten/r.target)*100 : 0);
  const pctPlan = Math.min(100, r.target>0 ? (r.plan/r.target)*100 : 0);
  const over = r.eaten > r.target;
  const dec = r.key==='kcal' ? 0 : 1;
  return `
    <div class="macro-row">
      <div class="macro-label">${r.label}</div>
      <div class="macro-bar-track">
        <div class="macro-bar-fill" style="width:${pctEaten}%;background:${r.color};"></div>
        <div class="macro-bar-marker" style="left:${pctPlan}%;"></div>
      </div>
      <div class="macro-value ${over?'over':''}">${r.eaten.toFixed(dec)}${r.unit} / ${r.target.toFixed(dec)}${r.unit}</div>
    </div>
  `;
}
function renderMacroPanel(eaten, planTotal, target, type){
  const rows = [
    {key:'kcal', label:'Calories', unit:'', color:'var(--kcal)', eaten:eaten.kcal, plan:planTotal.kcal, target:target.kcal},
    {key:'p', label:'Protein', unit:'g', color:'var(--protein)', eaten:eaten.p, plan:planTotal.p, target:target.p},
    {key:'c', label:'Carbs', unit:'g', color:'var(--carbs)', eaten:eaten.c, plan:planTotal.c, target:target.c},
    {key:'f', label:'Fat', unit:'g', color:'var(--fat)', eaten:eaten.f, plan:planTotal.f, target:target.f},
  ];
  return `
    <section class="macro-panel ${type}">
      ${rows.map(renderMacroRow).join('')}
      <div class="plan-footnote">Today&rsquo;s full plan: ${planTotal.kcal.toFixed(0)} kcal &middot; ${planTotal.p.toFixed(0)}P / ${planTotal.c.toFixed(0)}C / ${planTotal.f.toFixed(0)}F</div>
    </section>
  `;
}
function renderWeeklyPanel(weekly){
  const rows = [
    {label:'Calories', unit:'', eaten:weekly.avgEaten.kcal, target:weekly.avgTarget.kcal},
    {label:'Protein', unit:'g', eaten:weekly.avgEaten.p, target:weekly.avgTarget.p},
    {label:'Carbs', unit:'g', eaten:weekly.avgEaten.c, target:weekly.avgTarget.c},
    {label:'Fat', unit:'g', eaten:weekly.avgEaten.f, target:weekly.avgTarget.f},
  ];
  return `
    <section class="weekly-panel">
      <div class="weekly-head"><span>Last 7 days &middot; avg/day</span><span class="weekly-logged">${weekly.loggedCount}/7 logged</span></div>
      <div class="weekly-rows">
        ${rows.map(r=>`
          <div class="weekly-row">
            <span>${r.label}</span>
            <span class="weekly-val">${r.eaten.toFixed(r.unit?1:0)}${r.unit}</span>
            <span class="weekly-target">/ ${r.target.toFixed(r.unit?1:0)}${r.unit}</span>
          </div>`).join('')}
      </div>
    </section>
  `;
}

/* ===================== RENDER: MEAL LIST ===================== */
function renderMealCard(meal){
  const m = mealMacros(meal);
  const itemsHtml = meal.manualMacros
    ? `<li>Quick-logged &mdash; ${escapeHtml(meal.manualMacros.notes||'no ingredient breakdown')}</li>`
    : meal.items.map(i=>{
        const ing = ingredientById(i.ing);
        return ing ? `<li>${formatQty(i)} ${escapeHtml(ing.name)}</li>` : '';
      }).join('');
  return `
    <div class="meal-card ${meal.checked?'checked':''}">
      <button class="check-toggle" data-action="toggle-check" data-id="${meal.id}" aria-pressed="${meal.checked}" aria-label="Mark ${escapeHtml(meal.name)} as eaten">
        <span class="check-box"></span>
      </button>
      <div class="meal-info">
        <div class="meal-name">${escapeHtml(meal.name)}</div>
        <div class="meal-macros">${m.kcal.toFixed(0)} kcal &middot; ${m.p.toFixed(0)}P / ${m.c.toFixed(0)}C / ${m.f.toFixed(0)}F</div>
        <details class="meal-items"><summary>Details</summary><ul>${itemsHtml}</ul></details>
      </div>
      <div class="meal-actions">
        <button class="icon-btn" data-action="edit-meal" data-id="${meal.id}" aria-label="Edit meal">&#9998;</button>
        <button class="icon-btn" data-action="delete-meal" data-id="${meal.id}" aria-label="Delete meal">&#128465;</button>
      </div>
    </div>
  `;
}
function renderMealList(meals){
  if(meals.length===0){
    return `<section class="meal-list">
      <div class="empty-state">No meals here yet. Add one below to get started.</div>
      <button class="add-meal-btn" data-action="open-add-meal">+ Add a meal</button>
    </section>`;
  }
  return `<section class="meal-list">
    ${meals.map(renderMealCard).join('')}
    <button class="add-meal-btn" data-action="open-add-meal">+ Add a meal</button>
  </section>`;
}

function renderIngredientResults(){
  const q = modalState.search.trim().toLowerCase();

function attachSelectedItemsEvents(){

  container.querySelectorAll('.qty-input').forEach(input=>{

      if(totalEl) totalEl.innerHTML = renderModalTotalText();
    });

      modalState.items.splice(idx, 1);
      document.getElementById('selectedItems').innerHTML = renderSelectedItems();
      document.getElementById('modalTotal').innerHTML = renderModalTotalText();

function attachNewFoodEvents(){
  const form = document.getElementById('newFoodForm');
  if(!form) return;
  document.getElementById('newFoodName').addEventListener('input', e=>{ modalState.newFood.name = e.target.value; });
  document.getElementById('newFoodLookupDesc').addEventListener('input', e=>{ modalState.newFood.lookupDesc = e.target.value; });
  document.getElementById('newFoodServingGrams').addEventListener('input', e=>{ modalState.newFood.servingGrams = e.target.value; });
  document.getElementById('newFoodUnit').addEventListener('change', e=>{
    const newUnit = e.target.value;
    const oldUnit = modalState.newFood.unit;
    if(newUnit !== oldUnit){
      const sg = parseFloat(modalState.newFood.servingGrams);
      const hasValidServing = isFinite(sg) && sg > 0;
      if(hasValidServing){
        const factor = (oldUnit==='g' && newUnit==='piece') ? (sg/100) : (100/sg);
        ['kcal','p','c','f'].forEach(k=>{
          const val = parseFloat(modalState.newFood[k]);
          if(isFinite(val)) modalState.newFood[k] = String(Math.round(val*factor*100)/100);
        });
        modalState.newFood.conversionWarning = '';
      }else{
        modalState.newFood.conversionWarning = 'Enter a typical serving size (grams) above to auto-convert — until then these numbers still reflect the old serving type, so double-check them.';
      }
    }
    modalState.newFood.unit = newUnit;
    render();
  });
  const unitLabelInput = document.getElementById('newFoodUnitLabel');
  if(unitLabelInput) unitLabelInput.addEventListener('input', e=>{ modalState.newFood.unitLabel = e.target.value; });
  document.getElementById('newFoodKcal').addEventListener('input', e=>{ modalState.newFood.kcal = e.target.value; });
  document.getElementById('newFoodP').addEventListener('input', e=>{ modalState.newFood.p = e.target.value; });
  document.getElementById('newFoodC').addEventListener('input', e=>{ modalState.newFood.c = e.target.value; });
  document.getElementById('newFoodF').addEventListener('input', e=>{ modalState.newFood.f = e.target.value; });
  document.getElementById('cancelNewFoodBtn').addEventListener('click', ()=>{ modalState.newFoodMode = false; render(); });
  document.getElementById('newFoodLookupBtn').addEventListener('click', async ()=>{
    const desc = modalState.newFood.lookupDesc.trim() || modalState.newFood.name.trim();
    if(!desc){ modalState.newFood.lookupStatus='error'; modalState.newFood.lookupError='Type a name or description first.'; render(); return; }
    modalState.newFood.lookupStatus = 'loading'; render();
    const result = await aiLookupMacros(desc, 'per100g');
    if(!modalState || !modalState.newFood) return; // modal may have closed while awaiting
    if(result.ok){
      modalState.newFood.kcal = String(result.data.kcal);
      modalState.newFood.p = String(result.data.p);
      modalState.newFood.c = String(result.data.c);
      modalState.newFood.f = String(result.data.f);
      modalState.newFood.unit = 'g';
      modalState.newFood.servingGrams = result.data.serving_grams ? String(result.data.serving_grams) : modalState.newFood.servingGrams;
      modalState.newFood.conversionWarning = '';
      modalState.newFood.lookupStatus = 'idle';
      const servingNote = result.data.serving_grams ? `Typical serving: ~${result.data.serving_grams}g. ` : '';
      modalState.newFood.lookupNote = servingNote + (result.data.notes||'');
      if(!modalState.newFood.name) modalState.newFood.name = desc;
    }else{
      modalState.newFood.lookupStatus = 'error';
      modalState.newFood.lookupError = `Couldn't get an estimate (${result.error}). Enter macros manually below.`;
    }
    render();
  });
  document.getElementById('saveNewFoodBtn').addEventListener('click', ()=>{
    const nf = modalState.newFood;
    const name = nf.name.trim();
    if(!name){ nf.lookupStatus='error'; nf.lookupError='Give the food a name first.'; render(); return; }
    const unit = nf.unit;
    const per = unit==='g' ? 100 : 1;
    const unitLabel = unit==='g' ? 'g' : (nf.unitLabel.trim() || 'serving');
    const newFood = {
      id:'custom-'+Date.now(), name, unit, per, unitLabel,
      kcal:clamp0(parseFloat(nf.kcal)), p:clamp0(parseFloat(nf.p)), c:clamp0(parseFloat(nf.c)), f:clamp0(parseFloat(nf.f)),
      source:'user'
    };
    meta.customFoods.push(newFood);
    persistMeta();
    modalState.items.push({ing:newFood.id, qty: unit==='g' ? 100 : 1});
    modalState.newFoodMode = false;
    modalState.newFood = defaultNewFood();
    modalState.search = '';
    render();
  });
}

/* ===================== MAIN RENDER (async, race-guarded, two views) ===================== */
let currentView = 'today'; // 'today' | 'progress'

async function render(){
  const myToken = ++renderToken;
  if(currentView === 'today') await renderTodayView(myToken);
  else await renderProgressView(myToken);
}

function renderTopTabs(){
  return `
    <div class="view-tabs">
      <button type="button" class="view-tab ${currentView==='today'?'active':''}" data-action="switch-view" data-view="today">Today</button>
      <button type="button" class="view-tab ${currentView==='progress'?'active':''}" data-action="switch-view" data-view="progress">Progress</button>
    </div>
  `;
}

async function renderTodayView(myToken){
  const key = dateStr(currentDate);
  const day = await getOrInitDay(key, currentDate);
  const weekly = await computeWeeklyAverage();
  if(myToken !== renderToken) return; // a newer render has since started; abandon this one

  const type = day.type;
  const target = type==='training' ? TRAINING_TARGET : REST_TARGET;
  const planTotal = dayTotals(day.meals);
  const eaten = checkedTotals(day.meals);

  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopTabs()}
    ${renderHeader(currentDate, type)}
    <main>
      ${renderMacroPanel(eaten, planTotal, target, type)}
      ${renderWeeklyPanel(weekly)}
      ${renderBodyLogPanel(day)}
      ${renderTrainingPanel(day)}
      ${renderMealList(day.meals)}
    </main>
    ${renderModalHTML()}
    ${renderImportModal()}
  `;
  attachBodyLogEvents();
  const importInput = document.getElementById('importFileInput');
  if(importInput){
    importInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      e.target.value = ''; // allow re-selecting the same file later
      if(!file) return;
      const result = await parseBackupFile(file);
      if(!result.ok){ alert(result.error); return; }
      importPendingData = result.data;
      render();
    });
  }
  if(modalState) attachModalEvents();
  if(importPendingData) attachImportModalEvents();
}

async function renderProgressView(myToken){
  const weightSeries = await getBodyLogSeries(90);
  const inbodyHistory = await getInBodyHistory();
  const consistency = await computeConsistency();
  if(myToken !== renderToken) return;

  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopTabs()}
    <div class="progress-head">Progress</div>
    <main>
      ${renderWeightChartSection(weightSeries)}
      ${renderInBodySection(inbodyHistory)}
      ${renderConsistencySection(consistency)}
    </main>
  `;
}

/* ---- Progress data aggregation ---- */
async function getBodyLogSeries(numDays){
  const end = new Date();
  const monthsNeeded = new Set();
  for(let i=0;i<numDays;i++){ const d=new Date(end); d.setDate(d.getDate()-i); monthsNeeded.add(monthKeyFor(d)); }
  for(const mk of monthsNeeded) await ensureMonthLoaded(mk);
  const points = [];
  for(let i=numDays-1;i>=0;i--){
    const d = new Date(end); d.setDate(d.getDate()-i);
    const mk = monthKeyFor(d), key = dateStr(d);
    const day = monthCache[mk] ? monthCache[mk][key] : null;
    if(day && day.body && (day.body.weight!=null || day.body.bf!=null || day.body.smm!=null)){
      points.push({date:key, weight:day.body.weight, bf:day.body.bf, smm:day.body.smm});
    }
  }
  return points;
}
async function getInBodyHistory(){
  const points = await getBodyLogSeries(180);
  return points.filter(p=>p.bf!=null || p.smm!=null);
}
async function computeConsistency(){
  const numDays = 30;
  const end = new Date();
  const monthsNeeded = new Set();
  for(let i=0;i<numDays;i++){ const d=new Date(end); d.setDate(d.getDate()-i); monthsNeeded.add(monthKeyFor(d)); }
  for(const mk of monthsNeeded) await ensureMonthLoaded(mk);
  let proteinHit=0, calorieOnTarget=0, liftingDays=0, cardioDays=0, totalConsidered=0;
  for(let i=0;i<numDays;i++){
    const d = new Date(end); d.setDate(d.getDate()-i);
    const mk = monthKeyFor(d), key = dateStr(d);
    const day = monthCache[mk] ? monthCache[mk][key] : null;
    if(!day) continue;
    totalConsidered++;
    const target = day.type==='training' ? TRAINING_TARGET : REST_TARGET;
    const eaten = checkedTotals(day.meals);
    if(target.p>0 && eaten.p >= target.p*0.95) proteinHit++;
    if(target.kcal>0 && Math.abs(eaten.kcal-target.kcal) <= target.kcal*0.1) calorieOnTarget++;
    if(day.training && day.training.liftingDone) liftingDays++;
    if(day.training && day.training.cardioDone) cardioDays++;
  }
  return {proteinHit, calorieOnTarget, liftingDays, cardioDays, totalConsidered};
}

/* ---- Progress rendering: weight chart, InBody comparison, consistency ---- */
function renderWeightChart(points){
  if(points.length===0) return `<div class="empty-hint">No weight logged yet — add one in the Today view.</div>`;
  const weights = points.map(p=>p.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const pad = (max-min)*0.15 || 2;
  const yMin = min-pad, yMax = max+pad;
  const w=500, h=160, mL=38, mR=10, mT=10, mB=20;
  const plotW=w-mL-mR, plotH=h-mT-mB;
  const xFor = i => points.length<=1 ? mL+plotW/2 : mL + (i/(points.length-1))*plotW;
  const yFor = v => mT + plotH - ((v-yMin)/(yMax-yMin||1))*plotH;
  const pathD = points.map((p,i)=>`${i===0?'M':'L'}${xFor(i).toFixed(1)},${yFor(p.weight).toFixed(1)}`).join(' ');
  const dots = points.map((p,i)=>`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.weight).toFixed(1)}" r="3" fill="var(--kcal)"></circle>`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="weight-chart">
      <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${h-mB}" stroke="var(--border)" stroke-width="1"/>
      <line x1="${mL}" y1="${h-mB}" x2="${w-mR}" y2="${h-mB}" stroke="var(--border)" stroke-width="1"/>
      <text x="2" y="${mT+8}" fill="var(--text-muted)" font-size="9">${yMax.toFixed(1)}</text>
      <text x="2" y="${h-mB}" fill="var(--text-muted)" font-size="9">${yMin.toFixed(1)}</text>
      <path d="${pathD}" fill="none" stroke="var(--kcal)" stroke-width="2"/>
      ${dots}
    </svg>
    <div class="chart-caption">${points[0].date} &rarr; ${points[points.length-1].date} &middot; ${points[points.length-1].weight}lb latest</div>
  `;
}
function renderWeightChartSection(points){
  const withWeight = points.filter(p=>p.weight!=null);
  return `<section class="progress-card"><div class="panel-head">Weight &middot; last 90 days</div>${renderWeightChart(withWeight)}</section>`;
}
function renderInBodySection(history){
  if(history.length===0){
    return `<section class="progress-card"><div class="panel-head">Latest InBody</div><div class="empty-hint">No InBody data logged yet — add Body Fat % / SMM in the Today view&rsquo;s Body log.</div></section>`;
  }
  const latest = history[history.length-1];
  const prev = history.length>1 ? history[history.length-2] : null;
  const rows = [
    {label:'Weight', unit:'lb', latest:latest.weight, prev:prev?prev.weight:null},
    {label:'Body Fat %', unit:'%', latest:latest.bf, prev:prev?prev.bf:null},
    {label:'Skeletal Muscle', unit:'lb', latest:latest.smm, prev:prev?prev.smm:null},
  ].filter(r=>r.latest!=null);
  return `
    <section class="progress-card">
      <div class="panel-head">Latest InBody &middot; ${latest.date}${prev?` (vs ${prev.date})`:''}</div>
      ${rows.map(r=>{
        const delta = (r.prev!=null) ? (r.latest-r.prev) : null;
        const deltaStr = delta==null ? '' : (delta>=0?'+':'')+delta.toFixed(1)+r.unit;
        return `<div class="inbody-row"><span>${r.label}</span><span class="inbody-val">${r.latest}${r.unit}</span>${delta!=null?`<span class="inbody-delta ${delta<0?'down':'up'}">${deltaStr}</span>`:'<span class="inbody-delta"></span>'}</div>`;
      }).join('')}
    </section>
  `;
}
function renderConsistencySection(c){
  const n = c.totalConsidered;
  const rows = [
    {label:'Protein target hit', val:c.proteinHit},
    {label:'Calories on target (&plusmn;10%)', val:c.calorieOnTarget},
    {label:'Lifting completed', val:c.liftingDays},
    {label:'Cardio completed', val:c.cardioDays, note:'target ~4/week'},
  ];
  return `
    <section class="progress-card">
      <div class="panel-head">Consistency &middot; last 30 days (${n}/30 logged)</div>
      ${rows.map(r=>`<div class="consistency-row"><span>${r.label}${r.note?` <span class="consistency-note">(${r.note})</span>`:''}</span><span class="consistency-val">${r.val}/${n}</span></div>`).join('')}
    </section>
  `;
}

/* ===================== TOP-LEVEL EVENT DELEGATION ===================== */
document.getElementById('app').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const key = dateStr(currentDate);
  const action = el.dataset.action;
  if(action==='switch-view'){ currentView = el.dataset.view; render(); }
  else if(action==='prev-day'){ currentDate.setDate(currentDate.getDate()-1); render(); }
  else if(action==='next-day'){ currentDate.setDate(currentDate.getDate()+1); render(); }
  else if(action==='go-today'){ currentDate = new Date(); render(); }
  else if(action==='reset-day'){
    if(confirm('Reset this day back to the standard plan? Any edits for this day will be lost.')) resetDay(key, currentDate);
  }
  else if(action==='backup'){ downloadBackup(); }
  else if(action==='import'){ document.getElementById('importFileInput').click(); }
  else if(action==='toggle-check'){ toggleChecked(key, el.dataset.id); }
  else if(action==='toggle-lifting'){ toggleTraining(key, 'liftingDone'); }
  else if(action==='toggle-cardio'){ toggleTraining(key, 'cardioDone'); }
  else if(action==='delete-meal'){
    if(confirm('Remove this meal for today?')) deleteMeal(key, el.dataset.id);
  }
  else if(action==='edit-meal'){ openEditMeal(el.dataset.id); }
  else if(action==='open-add-meal'){ openAddMeal(); }
});
document.getElementById('app').addEventListener('change', (e)=>{
  if(e.target.id==='datePicker'){
    const parts = e.target.value.split('-').map(Number);
    if(parts.length===3 && !parts.some(isNaN)){
      currentDate = new Date(parts[0], parts[1]-1, parts[2]);
      render();
    }
  }
});


/* ===================== PWA: install, offline, shortcuts ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* not available in this context (e.g. file://) — app still works, just without offline caching */ });
  });
}

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function showInstallBanner(kind){
  const el = document.getElementById('installBanner');
  if(!el || isStandalone() || localStorage.getItem('installBannerDismissed')==='1') return;
  if(kind === 'android'){
    el.innerHTML = `
      <div class="install-title">Install Recomp Tracker</div>
      <div class="install-body">Add it to your home screen for a full-screen app with offline support.</div>
      <div class="install-actions">
        <button type="button" class="install-dismiss" id="installDismissBtn">Not now</button>
        <button type="button" class="install-primary" id="installNowBtn">Install</button>
      </div>`;
  }else{
    el.innerHTML = `
      <div class="install-title">Install Recomp Tracker</div>
      <div class="install-body">Tap the Share icon below, then "Add to Home Screen" for a full-screen app with offline support.</div>
      <div class="install-actions">
        <button type="button" class="install-dismiss" id="installDismissBtn">Got it</button>
      </div>`;
  }
  el.className = 'install-banner visible';
  document.getElementById('installDismissBtn').addEventListener('click', ()=>{
    el.className = 'install-banner';
    try{ localStorage.setItem('installBannerDismissed','1'); }catch(e){}
  });
  const nowBtn = document.getElementById('installNowBtn');
  if(nowBtn) nowBtn.addEventListener('click', async ()=>{
    if(window.__deferredInstallPrompt){
      window.__deferredInstallPrompt.prompt();
      try{ await window.__deferredInstallPrompt.userChoice; }catch(e){}
    }
    el.className = 'install-banner';
  });
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  window.__deferredInstallPrompt = e;
  showInstallBanner('android');
});
if(isIOS() && !isStandalone()){
  setTimeout(()=>showInstallBanner('ios'), 1200);
}

function handleShortcutAction(){
  const params = new URLSearchParams(window.location.search);
  const action = params.get('action');
  if(action === 'addmeal'){ openAddMeal(); }
  else if(action === 'logweight'){
    setTimeout(()=>{ const el = document.getElementById('bodyWeight'); if(el) el.focus(); }, 100);
  }
}

/* ===================== INIT ===================== */
(async function init(){
  const loadedMeta = await loadDataKey(META_KEY);
  if(loadedMeta && Array.isArray(loadedMeta.customFoods)) meta = loadedMeta;
  render();
  handleShortcutAction();
})();
</script>
