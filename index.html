<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recomp Tracker</title>
<script src="foods-db.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#12151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp">
<style>
:root{
  /* Corrected for real-world legibility: the previous steps between page,
     card, and input were 1.08-1.11:1 apart -- invisible under any ambient
     light without maxing device brightness. These jump 2-3x further apart
     and elevation now comes from a lighter tint (like WhatsApp's message
     bubbles), not from shadow, since shadows can't read against near-black. */
  --bg:#12151b; --bg-2:#0d1015;
  --surface:#1f2430; --surface-2:#2c3344; --surface-3:#3a4257;
  --border:#454e64; --border-soft:#333c4e;
  --text:#f5f7fa; --text-muted:#aab4c4; --text-faint:#8f99a8;
  --training:#ff6b3d; --training-dim:#33201a; --training-text:#ff9e73;
  --rest:#5fa0c9; --rest-dim:#182833; --rest-text:#8cc3e6;
  --protein:#22c58a; --carbs:#f5a623; --fat:#d661e0; --kcal:#f7e7c4; --fiber:#4db3e8;
  --over:#ff6b3d; --danger:#f2665f;
  --track:#333c4e; --ghost:#454e64; --tick:#5c6780;
  --font-serif:ui-serif,'Iowan Old Style','Palatino Linotype',Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -8px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
/* The day-swipe transition translates content past the edge of the viewport.
   Without a background on <html> itself and overflow containment, that split
   second exposes the WebView/Safari canvas underneath -- which defaults to
   black in a dark-themed standalone PWA. This is the actual source of the
   "black screen" during swipe, not the animation logic. */
html{background:var(--bg);overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 60% at 50% 0%, #1a1f29 0%, var(--bg) 46%, var(--bg-2) 100%);
  background-attachment:fixed;overflow-x:hidden;overscroll-behavior-x:none;}
button{font-family:var(--font-sans);}
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--kcal);outline-offset:2px;border-radius:4px;}
.app{max-width:560px;margin:0 auto;padding:16px 16px 72px;min-height:100vh;}

.brand-strip{font-family:var(--font-mono);font-size:10px;letter-spacing:2.6px;color:var(--text-faint);text-align:center;margin:0 0 14px;text-transform:uppercase;font-weight:400;}
.loading-state{text-align:center;padding:90px 20px;color:var(--text-muted);font-family:var(--font-mono);}

/* Header */
.app-header{padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.date-nav{display:flex;align-items:center;justify-content:center;gap:16px;}
.nav-btn{background:var(--surface);border:1px solid var(--border-soft);color:var(--text-muted);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;transition:background .16s var(--ease),color .16s,transform .12s;line-height:1;}
.nav-btn:active{transform:scale(.92);}
.nav-btn:hover{background:var(--surface-2);color:var(--text);}
.date-display{text-align:center;position:relative;min-width:190px;}
.date-label{font-family:var(--font-serif);font-size:21px;font-weight:600;letter-spacing:.1px;}
.date-picker{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;border:none;}
.header-row2{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
.pill{font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;padding:4px 11px;border-radius:999px;font-weight:600;}
.pill-training{background:var(--training-dim);color:var(--training-text);border:1px solid var(--training);}
.pill-rest{background:var(--rest-dim);color:var(--rest-text);border:1px solid var(--rest);}
.link-btn{background:none;border:none;color:var(--text-muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:5px 6px;min-height:26px;display:inline-flex;align-items:center;}
.link-btn:hover{color:var(--text);}

/* Macro panel */
.macro-panel{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--border);border-radius:var(--radius);padding:20px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;}
.macro-panel.training{border-top-color:var(--training);}
.macro-panel.rest{border-top-color:var(--rest);}
.macro-row{display:grid;grid-template-columns:66px 1fr auto;align-items:center;gap:12px;margin-bottom:14px;}
.macro-row:last-of-type{margin-bottom:8px;}
.macro-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
.macro-bar-track{position:relative;height:10px;background:var(--surface-2);border-radius:6px;}
.macro-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;transition:width .4s ease;}
.macro-bar-marker{position:absolute;top:-3px;width:2px;height:16px;background:var(--text-muted);border-radius:1px;}
.macro-value{font-family:var(--font-mono);font-size:13px;text-align:right;min-width:96px;}
.macro-value.over{color:var(--training);}
.plan-footnote{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}

/* Weekly panel */
.weekly-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.weekly-head{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;margin:0 0 10px;font-weight:600;}
.weekly-logged{font-family:var(--font-mono);text-transform:none;letter-spacing:0;}
.weekly-rows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.weekly-row{display:flex;flex-direction:column;gap:2px;}
.weekly-row span:first-child{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
.weekly-val{font-family:var(--font-mono);font-size:13px;}
.weekly-target{color:var(--text-muted);font-size:11px;}

/* Meal list */
.meal-list{display:flex;flex-direction:column;gap:10px;}
.empty-state{text-align:center;padding:38px 22px;color:var(--text-muted);border:1px dashed var(--border);border-radius:var(--radius);background:linear-gradient(180deg,rgba(255,255,255,.014),transparent);}
.empty-title{font-family:var(--font-serif);font-size:15px;color:var(--text);margin-bottom:6px;}
.empty-sub{font-size:12px;line-height:1.5;}
.meal-card{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px;transition:border-color .2s var(--ease),transform .12s var(--ease),background .2s;box-shadow:var(--shadow);}
.meal-card:active{transform:scale(.995);}
.meal-card.checked{border-color:rgba(79,163,125,.55);background:linear-gradient(180deg,rgba(79,163,125,.07),transparent 60%);}
.meal-card.checked .meal-name{opacity:.85;}
.check-toggle{background:none;border:none;padding:0;cursor:pointer;flex-shrink:0;margin-top:2px;position:relative;}
.check-box{display:block;width:26px;height:26px;border-radius:7px;border:2px solid var(--border);transition:all .18s var(--ease);position:relative;}
.check-toggle:active .check-box{transform:scale(.9);}
.meal-card.checked .check-box{background:var(--protein);border-color:var(--protein);}
.meal-card.checked .check-box::after{content:'';position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg);}
.meal-info{flex:1;min-width:0;}
.meal-name{font-family:var(--font-serif);font-weight:600;font-size:15px;margin-bottom:3px;}
.meal-macros{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);}
.meal-items{margin-top:8px;font-size:12px;}
.meal-items summary{color:var(--text-muted);cursor:pointer;}
.meal-items ul{margin:6px 0 0;padding-left:18px;color:var(--text-muted);}
.meal-actions{display:flex;flex-direction:column;gap:6px;}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text-muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;position:relative;}
.icon-btn:hover{color:var(--text);border-color:var(--text-muted);}
.add-meal-btn{background:none;border:1px dashed var(--border);color:var(--text-muted);padding:12px;border-radius:var(--radius);cursor:pointer;font-size:14px;margin-top:4px;width:100%;transition:all .15s;}
.add-meal-btn:hover{border-color:var(--text);color:var(--text);}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,11,13,.7);display:flex;align-items:flex-end;justify-content:center;z-index:400;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border:1px solid var(--border);border-top-color:var(--border-soft);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px -12px rgba(0,0,0,.75);animation:sheetUp .26s var(--ease);}
@keyframes sheetUp{from{transform:translateY(22px);opacity:.6;}to{transform:none;opacity:1;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-head h3{font-family:var(--font-serif);margin:0;font-size:18px;}
.field-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin:14px 0 6px;}
.text-input, select.text-input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;}

/* Tabs */
.tab-row{display:flex;gap:8px;margin-bottom:4px;}
.tab-btn{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.tab-btn.active{background:var(--protein);color:#0e1410;border-color:var(--protein);}

.ing-results{max-height:160px;overflow-y:auto;margin-top:8px;border:1px solid var(--border);border-radius:8px;}
.ing-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;gap:8px;}
.ing-row:last-child{border-bottom:none;}
.ing-name{flex:1;min-width:0;}
.ing-source-tag{font-size:9px;color:var(--rest-text);border:1px solid var(--rest);border-radius:4px;padding:1px 4px;margin-left:6px;text-transform:uppercase;}
.ing-meta{font-family:var(--font-mono);color:var(--text-muted);font-size:11px;white-space:nowrap;}
.ing-row button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;flex-shrink:0;}
.ing-row button:hover{border-color:var(--protein);color:var(--protein);}
.new-food-toggle{background:none;border:none;color:var(--rest-text);font-size:12px;text-decoration:underline;cursor:pointer;padding:8px 2px;display:block;}
.new-food-form{border:1px dashed var(--rest);border-radius:10px;padding:12px;margin-top:8px;background:var(--rest-dim);}
.macro-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.macro-input-grid label{font-size:10px;color:var(--text-muted);display:block;margin-bottom:3px;}
.lookup-row{display:flex;gap:8px;margin-top:8px;align-items:flex-start;}
.lookup-row .text-input{flex:1;}
.lookup-btn{background:var(--rest);color:#0e1720;border:1px solid var(--rest);border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.lookup-btn:disabled{opacity:.6;cursor:wait;}
.lookup-status{font-size:12px;color:var(--text-muted);margin-top:6px;min-height:16px;}
.lookup-status.error{color:var(--training);}
.hint-text{font-size:11px;color:var(--text-muted);margin-top:6px;}

.selected-head{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;}
.selected-list{display:flex;flex-direction:column;gap:6px;}
.sel-row{display:grid;grid-template-columns:1fr 56px auto 64px auto;align-items:center;gap:6px;background:var(--surface-2);padding:8px 10px;border-radius:8px;}
.sel-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qty-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 6px;border-radius:6px;font-family:var(--font-mono);font-size:13px;}
.sel-unit{font-size:10px;color:var(--text-muted);white-space:nowrap;}
.sel-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:right;white-space:nowrap;}
.remove-btn{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px 6px;min-width:26px;min-height:26px;position:relative;}
.remove-btn:hover{color:var(--danger);}
.modal-total{font-family:var(--font-mono);font-size:14px;text-align:center;padding:12px;background:var(--surface-2);border-radius:8px;margin-top:16px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn-ghost,.btn-primary{flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);}
.btn-ghost{background:none;color:var(--text-muted);}
.btn-primary{background:var(--protein);color:#0e1410;border-color:var(--protein);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.6;cursor:wait;}
.empty-hint{padding:12px;text-align:center;color:var(--text-muted);font-size:12px;}
.save-warning{color:var(--training);font-size:12px;text-align:center;margin-top:8px;display:none;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important;}}
@media (min-width:640px){.modal-backdrop{align-items:center;}.modal{border-radius:16px;}}

.save-indicator{position:fixed;bottom:16px;right:16px;left:auto;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text-muted);display:none;align-items:center;gap:8px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.35);}
.install-banner{position:fixed;left:16px;right:16px;bottom:16px;background:var(--surface);border:1px solid var(--protein);border-radius:12px;padding:14px 16px;z-index:210;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.install-banner.visible{display:block;}
.install-banner .install-title{font-family:var(--font-serif);font-weight:600;font-size:14px;margin-bottom:4px;}
.install-banner .install-body{font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:10px;}
.install-banner .install-actions{display:flex;gap:8px;}
.install-banner button{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);}
.install-banner .install-primary{background:var(--protein);color:#0e1410;border-color:var(--protein);}
.install-banner .install-dismiss{background:none;color:var(--text-muted);}
.save-indicator.visible{display:flex;}
.save-indicator.error{color:var(--training);border-color:var(--training);}
.save-indicator button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;flex-shrink:0;}

.view-tabs{display:flex;gap:8px;margin-bottom:16px;}
.view-tab{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.view-tab.active{background:var(--surface-2);color:var(--text);border-color:var(--text-muted);}
.progress-head{font-family:var(--font-serif);font-size:22px;font-weight:600;text-align:center;margin:0 0 18px;}

.body-log-panel,.training-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.panel-head{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;font-weight:600;}
.body-log-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.body-log-grid label{font-size:10px;color:var(--text-muted);display:block;margin-bottom:4px;}
.training-row{display:flex;gap:10px;}
.toggle-pill{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);padding:10px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;}
.toggle-pill.active{background:var(--protein);color:#0e1410;border-color:var(--protein);}

.progress-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.weight-chart{width:100%;height:auto;display:block;}
.chart-caption{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:center;margin-top:8px;}
.inbody-row,.consistency-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.inbody-row:last-child,.consistency-row:last-child{border-bottom:none;}
.inbody-val,.consistency-val{font-family:var(--font-mono);}
.inbody-delta{font-family:var(--font-mono);font-size:11px;min-width:48px;text-align:right;}
.inbody-delta.up{color:var(--carbs);}
.inbody-delta.down{color:var(--rest-text);}
.consistency-note{color:var(--text-muted);font-size:11px;font-weight:400;}

/* screen-reader-only labels for the compact history grid */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* --- water --- */
.water-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.water-row{display:flex;align-items:center;gap:12px;}
.water-dial{width:44px;height:44px;flex-shrink:0;}
.water-read{flex:1;min-width:0;}
.water-figure{font-family:var(--font-mono);font-size:19px;font-weight:600;}
.water-unit{font-size:12px;color:var(--text-muted);font-weight:400;}
.water-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.water-undo{flex-shrink:0;}
.water-buttons{display:flex;gap:8px;margin-top:12px;}
.water-btn{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:9px 4px;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .16s var(--ease),transform .1s;}
.water-btn:hover{border-color:var(--rest);}
.water-btn:active{transform:scale(.95);}

/* --- food row actions + editor --- */
.food-row-actions{display:flex;gap:4px;flex-shrink:0;}
.fe-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);margin-top:14px;cursor:pointer;}
.fe-check input{width:18px;height:18px;}

/* --- weigh-in history --- */
.bh-list{display:flex;flex-direction:column;gap:6px;}
.bh-row{display:grid;grid-template-columns:auto 1fr 1fr 1fr auto;align-items:center;gap:6px;background:var(--surface-2);padding:7px 9px;border-radius:var(--radius-sm);}
.bh-date{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);white-space:nowrap;}
.bh-input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 5px;border-radius:6px;font-family:var(--font-mono);font-size:12px;text-align:center;}

/* --- adaptive target card --- */
.tdee-figure{font-family:var(--font-mono);font-size:34px;font-weight:600;color:var(--kcal);letter-spacing:-1px;line-height:1;}
.tdee-unit{font-size:12px;color:var(--text-muted);margin-left:8px;letter-spacing:0;font-weight:400;}
.tdee-sub{font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.5;}
.tdee-rows{margin-top:14px;}
.tdee-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
.tdee-row:last-child{border-bottom:none;}
.tdee-val{font-family:var(--font-mono);color:var(--text);}
.tdee-suggest{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:14px;background:var(--surface-2);border-radius:var(--radius-sm);border:1px solid var(--border-soft);}
.ts-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
.ts-value{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:3px;}
.ts-delta{font-size:11px;color:var(--text-muted);margin-top:3px;}
.ts-apply{flex-shrink:0;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;background:var(--protein);color:#08120c;border:1px solid var(--protein);}
.adaptive-pending{padding:4px 0;}
.ap-title{font-family:var(--font-serif);font-size:15px;margin-bottom:7px;}
.ap-body{font-size:12.5px;color:var(--text-muted);line-height:1.55;}
.ap-list{margin:9px 0;padding-left:19px;font-size:12.5px;color:var(--text-muted);line-height:1.7;}
.ap-note{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin-top:10px;}
.ap-note.warn{color:var(--training-text);}

/* --- trend chart --- */
.trend-chart{width:100%;height:auto;display:block;margin-top:4px;}
.trend-legend{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--text-muted);margin-top:8px;flex-wrap:wrap;}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.sw-kcal{background:var(--kcal);}
.sw-target{background:var(--text-faint);}
.trend-gap{margin-left:auto;font-family:var(--font-mono);}

/* --- heatmap --- */
.heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:4px;}
.hm{display:block;width:100%;aspect-ratio:1;border-radius:3px;background:var(--surface-2);}
.hm-none{background:var(--surface-2);}
.hm-low{background:rgba(228,87,46,.3);}
.hm-near{background:rgba(217,164,65,.55);}
.hm-good{background:var(--protein);}
.hm-over{background:var(--training);}
.hm-legend{display:flex;gap:12px;font-size:10.5px;color:var(--text-muted);margin-top:10px;flex-wrap:wrap;align-items:center;}
.hm-legend .hm{width:10px;height:10px;display:inline-block;margin-right:4px;vertical-align:middle;aspect-ratio:auto;}

/* --- swipe feedback --- */
.swipe-hint{position:fixed;top:50%;transform:translateY(-50%);z-index:180;pointer-events:none;opacity:0;transition:opacity .12s var(--ease);background:var(--surface-3);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--text-muted);white-space:nowrap;box-shadow:var(--shadow);}
.swipe-hint{display:none;}
.swipe-hint.visible{display:block;}
.swipe-hint.left{right:16px;}
.swipe-hint.right{left:16px;}
.swipe-hint.commit{color:var(--text);border-color:var(--protein);background:var(--surface-2);}
.swipe-hint.commit .swipe-hint-label{color:var(--protein);}

/* --- day-swipe stage: only the day's content lives in here, never the bottom
   nav or FAB, so chrome never moves or flickers during navigation. Outgoing
   and incoming panes are always both present and moving together -- there is
   no frame in which the stage is empty. --- */
.swipe-stage{position:relative;overflow:hidden;touch-action:pan-y;}
.swipe-pane{width:100%;}

/* --- 44px minimum touch target, without inflating any visible icon --- a
   transparent ::after extends the tappable area past the small glyph; taps
   landing on it still register as clicks on the button itself. --- */
.icon-btn::after, .check-toggle::after, .remove-btn::after{content:'';position:absolute;inset:-9px;}

/* --- add button press --- */
.fab-press{transform:scale(.88);}
.burn-chip{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);border:1px solid var(--border);border-radius:999px;padding:1px 7px;margin-left:6px;text-transform:none;letter-spacing:0;}
.training-row{gap:8px;}
.training-row .toggle-pill{font-size:12px;padding:9px 4px;}
.unit-select{background:var(--bg);border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:6px 4px;font-size:11px;flex-shrink:0;}
.modal-backdrop{animation:fadeIn .18s var(--ease);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* --- undo bar --- */
.undo-bar{position:fixed;left:16px;right:16px;bottom:82px;background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:220;box-shadow:0 10px 30px -8px rgba(0,0,0,.7);font-size:13px;}
.undo-bar.visible{display:flex;animation:undoIn .22s var(--ease);}
@keyframes undoIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.undo-bar button{background:none;border:none;color:var(--protein);font-weight:600;font-size:13px;cursor:pointer;padding:2px 4px;flex-shrink:0;}

/* --- saved meals --- */
.saved-strip{margin-bottom:6px;}
.saved-strip-head{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 8px;}
.saved-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.saved-chip{flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:2px;transition:border-color .16s var(--ease);}
.saved-chip:hover{border-color:var(--protein);}
.chip-name{font-size:12px;font-weight:600;white-space:nowrap;}
.chip-kcal{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
.reuse-btn{width:100%;background:none;border:1px dashed var(--border);color:var(--text-muted);padding:10px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;margin-top:12px;transition:border-color .16s,color .16s;}
.reuse-btn:hover:not(:disabled){border-color:var(--protein);color:var(--protein);}
.reuse-btn:disabled{opacity:.6;cursor:default;}

/* --- empty state --- */
.empty-actions{display:flex;gap:10px;margin-top:16px;justify-content:center;}
.empty-actions button{flex:0 1 auto;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);}
.empty-actions .btn-primary{background:var(--protein);color:#08120c;border-color:var(--protein);}
.empty-actions .btn-ghost{background:none;color:var(--text-muted);}

/* --- macro dial --- */
.dial-wrap{position:relative;width:190px;margin:2px auto 4px;}
.main-dial{width:190px;height:190px;display:block;}
.dial-arc{transition:stroke-dasharray .55s var(--ease);}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.dial-figure{font-family:var(--font-mono);font-size:38px;font-weight:600;letter-spacing:-1px;line-height:1;color:var(--kcal);}
.dial-figure.over{color:var(--over);}
.dial-unit{font-size:11px;color:var(--text-faint);margin-top:5px;letter-spacing:.3px;}
.dial-remaining{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:7px;padding:2px 9px;border:1px solid var(--border);border-radius:999px;}
.kcal-value{position:absolute;left:-9999px;}
.macro-minis{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:14px;}
.macro-mini{display:flex;flex-direction:column;align-items:center;gap:3px;}
.mini-dial{width:50px;height:50px;}
.mini-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.7px;}
.macro-mini .macro-value{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:center;min-width:0;}
.macro-mini .macro-value.over{color:var(--over);}

/* --- Phase 1a: search results, presets, bottom nav, FAB --- */
.results-note{font-size:11px;color:var(--text-muted);padding:8px 10px;border-bottom:1px solid var(--border);}
.ing-serving{font-size:10px;color:var(--text-muted);margin-left:6px;}
.ing-alias{font-size:9.5px;color:var(--rest-text);border:1px solid var(--rest);border-radius:4px;padding:1px 5px;margin-left:6px;}
.ing-source-tag.plan{color:var(--kcal);border-color:var(--kcal);}
.ai-search-block{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-top:1px dashed var(--border);background:var(--rest-dim);}
.ai-search-label{font-size:12px;color:var(--text-muted);}
/* Portion row: [count] x [serving] = [quantity] */
.sel-row-v2{background:var(--surface-2);padding:10px;border-radius:8px;}
.sel-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sel-head .sel-name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sel-head .sel-sub{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);white-space:nowrap;}
.portion-line{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
.portion-op{color:var(--text-muted);font-size:12px;flex-shrink:0;}
.cnt-input{width:48px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 6px;border-radius:6px;font-family:var(--font-mono);font-size:14px;text-align:center;}
.portion-line .qty-input{width:72px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 6px;border-radius:6px;font-family:var(--font-mono);font-size:14px;text-align:center;}
.preset-select{flex:1;min-width:60px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 6px;border-radius:6px;font-size:12px;}
.portion-line .sel-unit{font-size:11px;color:var(--text-muted);flex-shrink:0;}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(18,22,28,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border-soft);z-index:150;padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav button{flex:1;background:none;border:none;color:var(--text-faint);padding:9px 4px 11px;font-size:10px;letter-spacing:.2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .18s var(--ease);}
.bottom-nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.bottom-nav button.active{color:var(--protein);}

.fab{position:fixed;right:18px;bottom:76px;width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,#2fdba0,#22c58a);color:#08120c;border:none;font-size:30px;font-weight:300;line-height:1;cursor:pointer;z-index:160;box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06) inset;display:flex;align-items:center;justify-content:center;transition:transform .14s var(--ease),box-shadow .18s;}
.fab:hover{box-shadow:0 10px 26px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1) inset;}
.fab:active{transform:scale(.94);}
.app{padding-bottom:120px;}
.save-indicator{bottom:82px;}
.install-banner{bottom:80px;}
.foods-list{display:flex;flex-direction:column;}
.food-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.food-row:last-child{border-bottom:none;}
.food-row-main{min-width:0;flex:1;}
.food-row-name{font-size:13px;}
.food-row-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:2px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.settings-row:last-of-type{border-bottom:none;}

/* --- Phase 1b: onboarding, day-type picker, plan editor --- */
.onboard-wrap{max-width:520px;margin:0 auto;padding-top:32px;}
.ob-progress{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--text-muted);text-align:center;margin-bottom:14px;text-transform:uppercase;}
.ob-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
.ob-title{font-family:var(--font-serif);font-size:21px;font-weight:600;margin-bottom:6px;}
.ob-sub{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:18px;}
.ob-choices{display:flex;flex-direction:column;gap:10px;}
.ob-choice{width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;color:var(--text);}
.ob-choice.sel{border-color:var(--protein);background:rgba(79,163,125,.12);}
.ob-choice-t{font-family:var(--font-serif);font-weight:600;font-size:14px;margin-bottom:4px;}
.ob-choice-d{font-size:12px;color:var(--text-muted);line-height:1.45;}
.ob-actions{display:flex;gap:10px;margin-top:22px;}
.ob-actions .btn-ghost,.ob-actions .btn-primary{flex:1;}
.ob-actions .btn-primary:disabled{opacity:.45;cursor:not-allowed;}

.daytype-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:4px 0 10px;}
.daytype-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 2px;cursor:pointer;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:3px;}
.daytype-btn.training{background:var(--training-dim);border-color:var(--training);color:var(--training-text);}
.dt-day{font-family:var(--font-mono);font-size:13px;font-weight:600;}
.dt-state{font-size:9px;text-transform:uppercase;letter-spacing:.4px;}

.plan-edit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.mini-select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:12px;}
.target-edit-group{margin-top:12px;}
.target-edit-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;}
.error-boundary{background:var(--surface);border:1px solid var(--training);border-radius:var(--radius);padding:20px;margin-top:24px;}
.eb-title{font-family:var(--font-serif);font-weight:600;font-size:16px;margin-bottom:8px;}
.eb-body{font-size:13px;color:var(--text-muted);line-height:1.55;margin-bottom:14px;}
.eb-actions{display:flex;gap:10px;margin-bottom:12px;}
.eb-details{font-size:12px;color:var(--text-muted);}
.eb-details summary{cursor:pointer;}
.eb-details pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);padding:10px;border-radius:8px;font-size:11px;margin-top:8px;}

</style>

<body>

<script>
/* ===================== BUILT-IN INGREDIENT DATABASE ===================== */
const INGREDIENTS = [

  {id:'blackbeans', name:'Black Beans (canned)', unit:'g', per:100, unitLabel:'g', kcal:91, p:5.9, c:16.6, f:0.4, fib:8.7},
  {id:'rice', name:'Cooked White Rice', unit:'g', per:100, unitLabel:'g', kcal:130, p:2.4, c:28, f:0.3, fib:0.4},

  {id:'eggwhite', name:'Egg White (large)', unit:'piece', per:1, unitLabel:'egg white', kcal:17, p:3.6, c:0.2, f:0.05, fib:0},
  {id:'wholeegg', name:'Whole Egg (large)', unit:'piece', per:1, unitLabel:'egg', kcal:72, p:6.3, c:0.36, f:4.8, fib:0},
  {id:'date', name:'Medjool Date', unit:'piece', per:1, unitLabel:'date', kcal:66, p:0.4, c:18, f:0, fib:1.6},
  {id:'sriracha', name:'TJ Sriracha', unit:'tbsp', per:1, unitLabel:'tbsp', kcal:10, p:0, c:2, f:0, fib:0.2},
  {id:'dkbread', name:"Dave's Killer Bread", unit:'piece', per:1, unitLabel:'slice', kcal:110, p:5, c:22, f:2, fib:5.0},
  {id:'apple', name:'Medium Apple', unit:'piece', per:1, unitLabel:'apple', kcal:95, p:0.5, c:25, f:0.3, fib:4.4},
  {id:'almond', name:'Almond', unit:'piece', per:1, unitLabel:'almond', kcal:7, p:0.26, c:0.26, f:0.6, fib:0.15},
  {id:'fishoil', name:'Fish Oil 1200mg', unit:'piece', per:1, unitLabel:'softgel', kcal:11, p:0, c:0, f:1.2, fib:0},
  {id:'vitacraves', name:'VitaCraves Gummy', unit:'piece', per:1, unitLabel:'gummy', kcal:7.5, p:0, c:2, f:0, fib:0},
  {id:'cottagecheese', name:'Low-Fat Cottage Cheese', unit:'g', per:100, unitLabel:'g', kcal:80, p:11.1, c:3.56, f:2.22, fib:0},
  {id:'blueberries', name:'Blueberries', unit:'g', per:100, unitLabel:'g', kcal:57, p:0.77, c:14.5, f:0.31, fib:2.4},
];

/* ===================== MEAL TEMPLATES ===================== */
const BREAKFAST_ITEMS = [
  {ing:'eggwhite',qty:4},{ing:'wholeegg',qty:1},{ing:'oats',qty:80},
  {ing:'almondmilk',qty:1},{ing:'date',qty:2.5},{ing:'yogurt',qty:40},
  {ing:'sriracha',qty:1},{ing:'dkbread',qty:2},{ing:'apple',qty:1},{ing:'almond',qty:5}
];
const LUNCH_ITEMS = [
  {ing:'tofu',qty:200},{ing:'oliveoil',qty:1},{ing:'tacoseasoning',qty:1},
  {ing:'rice',qty:100},{ing:'blackbeans',qty:100},{ing:'yogurt',qty:30},{ing:'pepponion',qty:1}
];
const SUPPLEMENTS_ITEMS = [ {ing:'fishoil',qty:2},{ing:'vitacraves',qty:2} ];
const DINNER_ITEMS = [
  {ing:'tofu',qty:200},{ing:'chipotleseasoning',qty:1},{ing:'blackbeans',qty:100},
  {ing:'tortilla',qty:1},{ing:'yogurt',qty:30},{ing:'pepponion',qty:1}
];
const PRESLEEP_ITEMS = [ {ing:'cottagecheese',qty:225},{ing:'blueberries',qty:65} ];

/* These are SEED DEFAULTS ONLY. On first run they are copied into the user's
   profile, after which the profile is the single source of truth and these
   constants are never read again. Editing a plan edits profile data, not code. */
const DEFAULT_TRAINING_TEMPLATE = [
  {id:'breakfast', name:'Breakfast + Snacks', items:BREAKFAST_ITEMS},
  {id:'lunch', name:'Lunch — Tofu Rice & Beans Bowl', items:LUNCH_ITEMS},
  {id:'supplements', name:'Supplements', items:SUPPLEMENTS_ITEMS},
  {id:'preworkout', name:'Pre-Workout', items:[{ing:'banana',qty:1}]},
  {id:'postworkout', name:'Post-Workout', items:[{ing:'whey',qty:1},{ing:'banana',qty:1},{ing:'oats',qty:35}]},
  {id:'dinner', name:'Dinner — Chipotle Tofu Wrap', items:DINNER_ITEMS},
  {id:'presleep', name:'Pre-Sleep', items:PRESLEEP_ITEMS},
];
const DEFAULT_REST_TEMPLATE = [
  {id:'breakfast', name:'Breakfast + Snacks', items:BREAKFAST_ITEMS},
  {id:'lunch', name:'Lunch — Tofu Rice & Beans Bowl', items:LUNCH_ITEMS},
  {id:'supplements', name:'Supplements', items:SUPPLEMENTS_ITEMS},
  {id:'middayprotein', name:'Midday Protein', items:[{ing:'whey',qty:1}]},
  {id:'dinner', name:'Dinner — Chipotle Tofu Wrap', items:DINNER_ITEMS},
  {id:'presleep', name:'Pre-Sleep', items:PRESLEEP_ITEMS},
];
/* Weekday index 0=Sunday .. 6=Saturday */
const DEFAULT_DAY_TYPES = ['rest','training','training','training','training','training','rest'];

/* ===================== APP DATA (profile + custom foods) ===================== */
const CURRENT_SCHEMA = 3;

let meta = null; // populated by init(); shape guaranteed by migrateMeta()

function deepClone(x){ return JSON.parse(JSON.stringify(x)); }

function createDefaultMeta(){
  return {
    schemaVersion: CURRENT_SCHEMA,
    customFoods: [],
    foodStats: {},      // foodId -> {count, last} for recent/frequent ranking
    savedMeals: [],     // reusable meals, e.g. "my usual breakfast"
    profile: {
      createdAt: new Date().toISOString(),
      dayTypes: DEFAULT_DAY_TYPES.slice(),
      templates: {
        training: deepClone(DEFAULT_TRAINING_TEMPLATE),
        rest: deepClone(DEFAULT_REST_TEMPLATE),
      },
      /* 'auto' derives targets from the template totals (plan-first users);
         'manual' uses the stored numbers verbatim (log-first users). */
      targetsMode: 'auto',
      targets: { training: null, rest: null },
      goalRate: -0.25,     // lb per week the user is aiming for
      waterTarget: 3000,   // ml per day
      waterUnit: 'ml',     // 'ml' | 'oz'
      onboarded: false,
      // Bring-your-own-key: the AI macro lookup calls api.anthropic.com directly
      // from the browser, so it needs a key the user supplies and that stays on
      // their device (never checked into the repo, never sent anywhere but
      // Anthropic's API). Empty until they add one in Settings.
      aiApiKey: '',
    },
  };
}

/* ===================== FOOD POOL =====================
   Three sources feed one searchable pool:
     1. INGREDIENTS  - the original plan foods (referenced by template item ids)
     2. FOOD_DB      - the bundled offline database (foods-db.js, per 100g)
     3. customFoods  - user-added, including AI lookups
   Plan foods win on exact name collisions so template references stay stable. */
let DB_FOODS = [];

/* Density in grams per millilitre. Water-based drinks are ~1.0; oils are lighter;
   milk marginally heavier. Without this a "250ml" entry would silently be treated
   as 250g, which is wrong by 8% for oil. */
const LIQUID_DENSITY = [
  [/\boils?\b|olive oil|canola|coconut oil|avocado oil|sesame oil|mustard oil|sunflower oil|vegetable oil|ghee/i, 0.92],
  [/milk|lassi|buttermilk|chaas|cream|kefir/i, 1.03],
  [/juice|smoothie/i, 1.05],
  [/water|tea|coffee|espresso|latte|cappuccino|cola|beer|wine|whiskey|vodka|kombucha|soup|broth|shake|drink/i, 1.0],
];
const LIQUID_CATS = new Set(['Beverages','Indian Beverages','Oils & Fats']);
function liquidDensityFor(name, cat){
  for(const [re, d] of LIQUID_DENSITY){ if(re.test(name)) return d; }
  if(LIQUID_CATS.has(cat)) return 1.0;
  return null;
}

function loadBundledFoodDb(){
  const raw = (typeof window !== 'undefined' && Array.isArray(window.FOOD_DB)) ? window.FOOD_DB : [];
  DB_FOODS = raw.map(row => ({
    id: 'db-' + row.id,
    name: row.name,
    cat: row.cat,
    unit: 'g', per: 100, unitLabel: 'g',
    kcal: row.kcal, p: row.p, c: row.c, f: row.f,
    fib: typeof row.fib === 'number' ? row.fib : 0,
    servings: Array.isArray(row.servings) ? row.servings : [],
    alias: Array.isArray(row.alias) ? row.alias : null,
    dens: liquidDensityFor(row.name, row.cat),   // non-null => measurable in ml
    source: 'db',
  }));
}

let _poolCache = null;
let _poolStamp = '';
function allIngredients(){
  const custom = (meta && meta.customFoods) ? meta.customFoods : [];
  // Cheap invalidation: pool only changes when custom foods or the DB change.
  const stamp = `${DB_FOODS.length}:${custom.length}`;
  if(_poolCache && _poolStamp === stamp) return _poolCache;
  const out = [];
  const seen = new Set();
  for(const list of [INGREDIENTS, custom, DB_FOODS]){
    for(const item of list){
      const key = item.name.trim().toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(item);
    }
  }
  _poolCache = out; _poolStamp = stamp;
  return out;
}
function invalidateFoodPool(){ _poolCache = null; }

/* Usage tracking powers the "recent" list. Most people rotate through a small
   set of foods, so surfacing what they actually ate beats an alphabetical list. */
function recordFoodUse(id){
  if(!meta.foodStats) meta.foodStats = {};
  const st = meta.foodStats[id] || {count:0, last:0};
  st.count += 1;
  st.last = Date.now();
  meta.foodStats[id] = st;
  persistMeta();
}
function recentFoods(limit){
  const stats = meta.foodStats || {};
  return Object.keys(stats)
    .map(id => ({id, st: stats[id]}))
    .sort((a,b) => b.st.last - a.st.last)
    .map(x => ingredientById(x.id))
    .filter(Boolean)
    .slice(0, limit);
}
function ingredientById(id){ return allIngredients().find(i=>i.id===id); }
function defaultQtyFor(ing){
  if(Array.isArray(ing.servings) && ing.servings.length) return ing.servings[0].g;
  return ing.unit === 'g' ? 100 : 1;
}
/* Build a fresh line item, defaulting to 1 x the food's first named serving. */
function newItemFor(ing){
  const hasServings = Array.isArray(ing.servings) && ing.servings.length > 0;
  const base = hasServings
    ? {ing: ing.id, qty: ing.servings[0].g, srv: 0, cnt: 1}
    : {ing: ing.id, qty: defaultQtyFor(ing)};
  // Drinks read in millilitres by default; nobody pours 240g of milk.
  if(ing.dens) base.mUnit = 'ml';
  return base;
}
/* Ranked, capped search. Rendering 800 rows is both slow and useless, so we
   rank (exact > prefix > word-prefix > substring) and cap. */
function searchFoods(query, limit){
  const q = query.trim().toLowerCase();
  const pool = allIngredients();
  if(!q){
    // No query: lead with what this person actually eats, then their plan foods.
    const seen = new Set();
    const out = [];
    for(const f of recentFoods(12)){ if(!seen.has(f.id)){ seen.add(f.id); out.push(f); } }
    const custom = (meta && meta.customFoods) ? meta.customFoods : [];
    for(const f of INGREDIENTS.concat(custom)){
      if(out.length >= limit) break;
      if(!seen.has(f.id)){ seen.add(f.id); out.push(f); }
    }
    return out.slice(0, limit);
  }
  const scored = [];
  for(const item of pool){
    const n = item.name.toLowerCase();
    const words = n.split(/[\s(/,+&-]+/).filter(Boolean);
    let score = -1;
    if(n === q) score = 0;                                  // exact full name
    else if(words.includes(q)) score = 1;                   // exact word ("roti" in "Roti / Chapati")
    else if(n.startsWith(q)) score = 2;                     // name prefix
    else if(words.some(w => w.startsWith(q))) score = 3;    // word prefix ("Rotisserie")
    else if(n.includes(q)) score = 4;                       // substring

    // Regional names ("dudhi nu shaak", "lauki", "thayir sadam") are how people
    // actually search, so an alias hit ranks alongside a name hit rather than
    // falling through to the AI lookup.
    if(Array.isArray(item.alias)){
      for(const a of item.alias){
        let as = -1;
        if(a === q) as = 0.5;
        else if(a.startsWith(q)) as = 2.5;
        else if(a.includes(q)) as = 4.5;
        if(as >= 0 && (score < 0 || as < score)) score = as;
      }
    }

    if(score >= 0){
      const ownBonus = (item.source === 'user') ? -0.4 : (item.source === 'db' ? 0.2 : 0);
      const wordIdx = words.indexOf(q);
      const posBonus = (wordIdx === 0) ? -0.3 : (wordIdx > 0 ? 0.1 : 0);
      scored.push({item, score: score + ownBonus + posBonus});
    }
  }
  scored.sort((a,b)=> a.score - b.score || a.item.name.length - b.item.name.length);
  return scored.slice(0, limit).map(s=>s.item);
}
function templateFor(type){
  const t = meta.profile.templates[type];
  return Array.isArray(t) ? t : [];
}

/* ===================== MACRO MATH ===================== */
function itemMacros(item){
  const ing = ingredientById(item.ing);
  if(!ing) return {kcal:0,p:0,c:0,f:0,fib:0};
  const factor = item.qty / ing.per;
  return {kcal:ing.kcal*factor, p:ing.p*factor, c:ing.c*factor, f:ing.f*factor,
          fib:(ing.fib||0)*factor};
}
function mealMacros(meal){
  if(meal.manualMacros) return {kcal:meal.manualMacros.kcal, p:meal.manualMacros.p,
    c:meal.manualMacros.c, f:meal.manualMacros.f, fib:meal.manualMacros.fib||0};
  return meal.items.reduce((acc,item)=>{
    const m = itemMacros(item);
    acc.kcal+=m.kcal; acc.p+=m.p; acc.c+=m.c; acc.f+=m.f; acc.fib+=m.fib;
    return acc;
  }, {kcal:0,p:0,c:0,f:0,fib:0});
}
function dayTotals(meals){
  return meals.reduce((acc,meal)=>{
    const m = mealMacros(meal);
    acc.kcal+=m.kcal; acc.p+=m.p; acc.c+=m.c; acc.f+=m.f; acc.fib+=(m.fib||0);
    return acc;
  }, {kcal:0,p:0,c:0,f:0,fib:0});
}
function checkedTotals(meals){ return dayTotals(meals.filter(m=>m.checked)); }
function dayHasAnyChecked(meals){ return meals.some(m=>m.checked); }

/* Targets are now DATA, not derived constants.
   - 'auto': totals of the user's own template (plan-first, e.g. a fixed diet)
   - 'manual': explicit numbers the user set (log-first, e.g. a new user)
   Callers must use targetFor(type) rather than any module-level constant. */
const FIBER_PER_1000_KCAL = 14;   // Institute of Medicine adequate-intake basis
function fiberTargetFor(target){
  return Math.round((target.kcal / 1000) * FIBER_PER_1000_KCAL);
}
function targetFor(type){
  const prof = meta.profile;
  if(prof.targetsMode === 'manual'){
    const t = prof.targets[type];
    if(t && typeof t.kcal === 'number') return t;
    // fall through to derived if manual targets were never set
  }
  return dayTotals(templateFor(type));
}

/* ===================== DATE HELPERS ===================== */
function dateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isWeekend(d){ const day=d.getDay(); return day===0||day===6; }
function dayTypeFor(d){
  const sched = meta && meta.profile && Array.isArray(meta.profile.dayTypes) ? meta.profile.dayTypes : DEFAULT_DAY_TYPES;
  return sched[d.getDay()] === 'training' ? 'training' : 'rest';
}
function formatDateLabel(d){ return d.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'}); }
function monthKeyFor(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

/* ===================== STORAGE (hybrid: Claude artifact storage, else localStorage) ===================== */
/* Storage calls can fail transiently. We retry quietly with backoff before surfacing
   anything, and never use console.error for expected, handled failures. */
const hasClaudeStorage = (typeof window.storage !== 'undefined');
const META_KEY = 'dietTracker:meta';
function monthStorageKey(mk){ return `dietTracker:days:${mk}`; }
function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function saveDataKey(key, value){
  const json = JSON.stringify(value);
  if(hasClaudeStorage){
    for(let attempt=0; attempt<3; attempt++){
      try{
        const result = await window.storage.set(key, json, false);
        if(result) return true;
      }catch(e){ /* transient — retry below */ }
      if(attempt < 2) await wait(400 * (attempt+1));
    }
    return false;
  }else{
    try{ localStorage.setItem(key, json); return true; }
    catch(e){ return false; }
  }
}
async function loadDataKey(key){
  if(hasClaudeStorage){
    for(let attempt=0; attempt<3; attempt++){
      try{
        const res = await window.storage.get(key, false);
        return res ? JSON.parse(res.value) : null;
      }catch(e){ /* transient — retry below */ }
      if(attempt < 2) await wait(400 * (attempt+1));
    }
    return null;
  }else{
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
}
async function listMonthKeys(){
  if(hasClaudeStorage){
    try{
      const res = await window.storage.list('dietTracker:days:', false);
      return res ? res.keys : [];
    }catch(e){ return []; }
  }else{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('dietTracker:days:')) keys.push(k);
    }
    return keys;
  }
}

/* ===================== APP STATE ===================== */
let monthCache = {};        // monthKey -> { dateKey: dayObject }
let monthLoadPromises = {}; // monthKey -> in-flight load promise (avoid duplicate fetches)
let currentDate = new Date();
let modalState = null;
let saveStatus = 'idle'; // 'idle' | 'saving' | 'saved' | 'error'
let saveStatusTimer = null;
let renderToken = 0;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clamp0(n){ return Math.max(0, isFinite(n) ? n : 0); }
function formatQty(item){
  const ing = ingredientById(item.ing);
  if(!ing) return `${item.qty}`;
  const q = item.qty;
  const useMl = item.mUnit === 'ml' && ing.dens;
  const amount = useMl ? `${Math.round(q / ing.dens)}ml` : `${trimNum(q)}g`;

  // Show how the portion was actually chosen: "2 x 1 roti (80g)" reads far
  // better on a meal card than a bare "80g".
  const port = itemPortion(item, ing);
  if(port.mode === 'serving'){
    const srv = ing.servings[port.srvIdx];
    const cnt = trimNum(port.cnt);
    return `${cnt} \u00d7 ${srv.label} (${amount})`;
  }
  if(ing.unit==='g') return amount;
  if(ing.unit==='tsp'||ing.unit==='tbsp') return `${trimNum(q)} ${ing.unitLabel}`;
  const plural = q!==1 ? 's' : '';
  return `${trimNum(q)} ${ing.unitLabel}${plural}`;
}
function ingredientMetaLabel(ing){
  const perLabel = ing.unit==='g' ? `${ing.per}g` : `1 ${ing.unitLabel}`;
  return `${Math.round(ing.kcal)} kcal / ${perLabel}`;
}
function cloneTemplate(tpl){
  return tpl.map(m=>({id:m.id, name:m.name, checked:false, items:m.items.map(i=>({...i})), manualMacros:null}));
}

/* ===================== SCHEMA MIGRATIONS =====================
   Every persisted structure carries a schemaVersion. Migrations run on load and
   are pure functions of the stored value, so an old device, a stale backup file,
   and a fresh install all converge on the current shape. Migrations must be
   additive and lossless: never drop a field we don't recognise. */

function migrateMeta(raw){
  // v0 (unversioned, pre-Phase-0): { customFoods: [...] } and nothing else.
  if(!raw || typeof raw !== 'object'){
    return {meta: createDefaultMeta(), migrated: true, from: 'none'};
  }
  let m = deepClone(raw);
  const from = typeof m.schemaVersion === 'number' ? m.schemaVersion : 0;
  let migrated = false;

  if(from < 2){
    // v0/v1 -> v2: introduce profile. Preserve customFoods exactly.
    const fresh = createDefaultMeta();
    fresh.customFoods = Array.isArray(m.customFoods) ? m.customFoods : [];
    // An existing user was, by definition, using the built-in plan in auto mode.
    fresh.profile.onboarded = true;
    m = fresh;
    migrated = true;
  }

  // Defensive backfill: a field added later should never leave meta half-shaped.
  const def = createDefaultMeta();
  if(!m.profile) { m.profile = def.profile; migrated = true; }
  if(!Array.isArray(m.customFoods)) { m.customFoods = []; migrated = true; }
  if(!Array.isArray(m.profile.dayTypes) || m.profile.dayTypes.length !== 7){
    m.profile.dayTypes = DEFAULT_DAY_TYPES.slice(); migrated = true;
  }
  if(!m.profile.templates || typeof m.profile.templates !== 'object'){
    m.profile.templates = def.profile.templates; migrated = true;
  }
  if(!m.profile.targets || typeof m.profile.targets !== 'object'){
    m.profile.targets = {training:null, rest:null}; migrated = true;
  }
  if(m.profile.targetsMode !== 'manual' && m.profile.targetsMode !== 'auto'){
    m.profile.targetsMode = 'auto'; migrated = true;
  }
  if(typeof m.profile.onboarded !== 'boolean'){ m.profile.onboarded = true; migrated = true; }
  if(typeof m.profile.goalRate !== 'number'){ m.profile.goalRate = -0.25; migrated = true; }
  if(typeof m.profile.waterTarget !== 'number'){ m.profile.waterTarget = 3000; migrated = true; }
  if(m.profile.waterUnit !== 'oz' && m.profile.waterUnit !== 'ml'){ m.profile.waterUnit = 'ml'; migrated = true; }
  if(typeof m.profile.aiApiKey !== 'string'){ m.profile.aiApiKey = ''; migrated = true; }
  // v3 additions
  if(!m.foodStats || typeof m.foodStats !== 'object'){ m.foodStats = {}; migrated = true; }
  if(!Array.isArray(m.savedMeals)){ m.savedMeals = []; migrated = true; }

  m.schemaVersion = CURRENT_SCHEMA;
  return {meta: m, migrated, from};
}

/* Month shards were previously a bare { 'YYYY-MM-DD': day } map with no version.
   They are now { v: N, days: {...} }. In memory we always work with the inner
   days map, so only the storage boundary knows about the wrapper. */
function migrateMonthShard(raw){
  if(!raw || typeof raw !== 'object') return {};
  if(typeof raw.v === 'number' && raw.days && typeof raw.days === 'object'){
    return migrateDays(raw.days);
  }
  // unversioned legacy shape: the object IS the days map
  return migrateDays(raw);
}
function migrateDays(days){
  const out = {};
  for(const key of Object.keys(days)){
    const day = days[key];
    if(!day || typeof day !== 'object') continue;
    out[key] = {
      type: day.type === 'training' ? 'training' : 'rest',
      meals: Array.isArray(day.meals) ? day.meals.map(m=>({
        id: m.id,
        name: m.name,
        checked: !!m.checked,
        items: Array.isArray(m.items) ? m.items : [],
        manualMacros: m.manualMacros || null,
      })) : [],
      body: day.body || null,
      training: day.training || null,
      water: typeof day.water === 'number' ? day.water : 0,
    };
  }
  return out;
}
function wrapMonthShard(daysMap){
  return {v: CURRENT_SCHEMA, days: daysMap};
}

/* ---- Month-sharded day storage ---- */
async function ensureMonthLoaded(mk){
  if(monthCache[mk]) return monthCache[mk];
  if(monthLoadPromises[mk]) return monthLoadPromises[mk];
  monthLoadPromises[mk] = (async ()=>{
    const data = await loadDataKey(monthStorageKey(mk));
    monthCache[mk] = migrateMonthShard(data);
    delete monthLoadPromises[mk];
    return monthCache[mk];
  })();
  return monthLoadPromises[mk];
}
async function persistToKey(key, value){
  saveStatus = 'saving'; updateSaveIndicator();
  const ok = await saveDataKey(key, value);
  saveStatus = ok ? 'saved' : 'error'; updateSaveIndicator();
  if(ok){
    clearTimeout(saveStatusTimer);
    saveStatusTimer = setTimeout(()=>{ if(saveStatus==='saved'){ saveStatus='idle'; updateSaveIndicator(); } }, 1500);
  }
  return ok;
}
async function persistMonth(mk){ return persistToKey(monthStorageKey(mk), wrapMonthShard(monthCache[mk])); }
async function persistMeta(){ return persistToKey(META_KEY, meta); }

function updateSaveIndicator(){
  const el = document.getElementById('saveIndicator');
  if(!el) return;
  if(saveStatus==='saving'){ el.className='save-indicator visible'; el.innerHTML='Saving&hellip;'; }
  else if(saveStatus==='saved'){ el.className='save-indicator visible'; el.innerHTML='Saved'; }
  else if(saveStatus==='error'){
    el.className='save-indicator visible error';
    el.innerHTML='Couldn&rsquo;t save that change. <button type="button" id="retrySaveBtn">Retry</button>';
    const btn = document.getElementById('retrySaveBtn');
    if(btn) btn.addEventListener('click', ()=>{ persistMonth(monthKeyFor(currentDate)); });
  }else{ el.className='save-indicator'; el.innerHTML=''; }
}

async function getOrInitDay(key, date){
  const mk = monthKeyFor(date);
  const month = await ensureMonthLoaded(mk);
  if(!month[key]){
    const type = dayTypeFor(date);
    const tpl = templateFor(type);
    month[key] = {type, meals: cloneTemplate(tpl)};
    // Await the write: leaving it in flight means a tap arriving moments later
    // races an unfinished save of the same month shard.
    await persistMonth(mk);
  }
  return month[key];
}
async function peekDay(date){
  const mk = monthKeyFor(date);
  const month = await ensureMonthLoaded(mk);
  const key = dateStr(date);
  if(month[key]) return month[key];
  const type = dayTypeFor(date);
  const tpl = templateFor(type);
  return {type, meals: cloneTemplate(tpl)};
}
function resetDay(key, date){
  const mk = monthKeyFor(date);
  const type = dayTypeFor(date);
  const tpl = templateFor(type);
  const prev = monthCache[mk][key] ? deepClone(monthCache[mk][key]) : null;
  monthCache[mk][key] = {type, meals:cloneTemplate(tpl)};
  persistMonth(mk);
  offerUndo('Day reset to your plan', async ()=>{
    if(prev) monthCache[mk][key] = prev;
    await persistMonth(mk);
    render();
  });
  render();
}
function vibrate(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
// The CSS `@media (prefers-reduced-motion:reduce)` rule only neutralises CSS
// transitions/animations; it has no effect on Element.animate() calls driven
// from JS, so every WAAPI-based transition in the app checks this directly.
function prefersReducedMotion(){
  return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function toggleChecked(key, mealId){
  const mk = monthKeyFor(currentDate);
  const day = monthCache[mk][key];
  const meal = day.meals.find(m=>m.id===mealId);
  if(meal){ meal.checked = !meal.checked; vibrate(12); persistMonth(mk); render(); }
}
function deleteMeal(key, mealId){
  const mk = monthKeyFor(currentDate);
  const day = monthCache[mk][key];
  const idx = day.meals.findIndex(m=>m.id===mealId);
  if(idx < 0) return;
  const removed = deepClone(day.meals[idx]);
  day.meals.splice(idx,1);
  persistMonth(mk);
  offerUndo(`Removed "${removed.name}"`, async ()=>{
    const d = monthCache[mk][key];
    if(d){ d.meals.splice(idx, 0, removed); await persistMonth(mk); render(); }
  });
  render();
}
function saveMealEntry(key, mealId, name, items, manualMacros){
  const mk = monthKeyFor(currentDate);
  const day = monthCache[mk][key];
  if(mealId){
    const meal = day.meals.find(m=>m.id===mealId);
    if(meal){ meal.name=name; meal.items=items; meal.manualMacros=manualMacros||null; }
  }else{
    day.meals.push({id:'meal-'+Date.now(), name, items, manualMacros: manualMacros||null, checked:true});
  }
  persistMonth(mk); render();
}

/* ---- Weekly (7-day) rolling average, always anchored to the real "today" ---- */
async function computeWeeklyAverage(){
  const anchor = new Date();
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(anchor); d.setDate(d.getDate()-i);
    days.push(await peekDay(d));
  }
  const totals = {kcal:0,p:0,c:0,f:0};
  const targetTotals = {kcal:0,p:0,c:0,f:0};
  let loggedCount = 0;
  for(const day of days){
    const t = checkedTotals(day.meals);
    totals.kcal+=t.kcal; totals.p+=t.p; totals.c+=t.c; totals.f+=t.f;
    const tgt = targetFor(day.type);
    targetTotals.kcal+=tgt.kcal; targetTotals.p+=tgt.p; targetTotals.c+=tgt.c; targetTotals.f+=tgt.f;
    if(dayHasAnyChecked(day.meals)) loggedCount++;
  }
  return {
    avgEaten: {kcal:totals.kcal/7, p:totals.p/7, c:totals.c/7, f:totals.f/7},
    avgTarget: {kcal:targetTotals.kcal/7, p:targetTotals.p/7, c:targetTotals.c/7, f:targetTotals.f/7},
    loggedCount
  };
}

/* ---- AI macro lookup (calls Claude directly from the artifact; no API key needed) ---- */
/* Indian regional dish names are the common case here, not an edge case, and
   the earlier prompt failed on them ("dudhi nu shaak", "fansi nu shaak"). The
   fix is to teach the model the naming conventions rather than hope it guesses,
   and to forbid refusal — an approximate number beats no number. */
const CUISINE_HINT = [
  'Food names are frequently Indian and may be written in Gujarati, Hindi, Marathi, Punjabi, Tamil, Telugu, Kannada, Bengali or Malayalam, in transliteration, and may be misspelled or use regional spellings.',

  '- Dish forms: "nu shaak"/"nu shak"/"sabzi"/"sabji"/"bhaji"/"subzi" = vegetable curry; "rassa"/"gravy" = with sauce; "sukhi"/"dry" = without.',
  '- "dal"/"daal"/"amti"/"varan" = lentils; "kadhi"/"kadi" = yoghurt and gram-flour curry; "rasam"/"saaru" = thin tamarind broth; "sambar" = lentil and vegetable stew.',
  '- Breads: rotli, rotlo, bhakhri, khakhra, thepla, phulka, paratha, puri, luchi, bhatura, kulcha, naan, makki di roti, akki roti, ragi roti, appam, puttu, idiyappam.',

  '- Vegetables: dudhi/lauki/ghiya = bottle gourd; fansi = green beans; ringan/baingan/vengan = aubergine; bhinda/bhindi = okra; tindora/tindla/tendli/kundru = ivy gourd; guvar/gavar = cluster beans; papdi/val papdi = field beans; turiya/turai = ridge gourd; karela = bitter gourd; suran/jimikand = yam; kobij = cabbage; flower/gobi = cauliflower; bateta/batata/aloo = potato; kanda/pyaz = onion; methi = fenugreek leaves; palak = spinach; lilva = fresh pigeon peas; matar = peas; tameta/tamatar = tomato; kaddu = pumpkin; arbi = colocasia; sem = broad beans.',
  '- Pulses: tuver/tuvar/toor/arhar = pigeon pea; chana = chickpea/bengal gram; mag/moong = mung; masoor = red lentil; urad/adad = black gram; rajma = kidney bean; matki = moth bean; chowli/lobia = black-eyed pea.',
  '- Gujarati farsan: dhokla, khaman, khandvi, patra, muthiya, fafda, ganthiya, khichu, handvo, locho, dabeli, gota, farsi puri.',
  '- Gujarati sweets: basundi, doodhpak, ghari, sukhdi, mohanthal, adadiya, malpua, churma, shrikhand, magas.',
  '- Home-style Gujarati and Maharashtrian vegetable dishes use roughly 1 to 1.5 teaspoons of oil per 150 g serving; Gujarati dals and shaaks often include a little jaggery. Punjabi and restaurant gravies use considerably more oil, butter or cream.',
  '- A "katori" is a small bowl, about 150 g of a gravy dish or cooked dal. A thali serving of rice is 150-200 g cooked.',
  'If a name is still ambiguous, choose the most common household interpretation and say which one you assumed in notes.',

/* This calls api.anthropic.com directly from the browser -- there is no
   backend to hold a secret key on a static GitHub Pages app. Anthropic
   supports that (bring-your-own-key, direct-browser-access header) for
   exactly this kind of small trusted-user tool; see Settings for where the
   key is entered. It never leaves the device except in this request. */
const AI_MODEL = 'claude-sonnet-5';
async function aiLookupMacros(description, mode){
  const apiKey = (meta.profile.aiApiKey || '').trim();
  if(!apiKey) return {ok:false, error:'Add an Anthropic API key in Settings to use AI lookup.'};

  const shared = `You are a nutrition estimation assistant inside a diet-tracking app.\n${CUISINE_HINT}`;
  const systemPrompt = mode === 'per100g'
    ? `${shared}\nGiven a food name, estimate its nutrition PER 100 GRAMS of the food as normally served (not per serving). Respond with ONLY a raw JSON object, no markdown fences and no prose, with exactly these keys: kcal, p, c, f, fiber (all numbers, per 100g), serving_grams (typical single-serving weight in grams, a number), notes (one short sentence naming the dish you assumed).`
    : `${shared}\nGiven a description of a meal someone ate (which may include a quantity such as "250g", "1 katori" or "2 rotli"), estimate the TOTAL nutrition for that entire described portion, not per 100g. Respond with ONLY a raw JSON object, no markdown fences and no prose, with exactly these keys: kcal, p, c, f, fiber (numbers, totals for the whole described meal), notes (one short sentence naming the dish and portion you assumed).`;

  async function attempt(userText){
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        // Anthropic's API is otherwise not reachable from browser JS (no CORS)
        // -- this opts into it for exactly the bring-your-own-key case.
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({ model:AI_MODEL, max_tokens:500, system:systemPrompt, messages:[{role:'user', content:userText}] })
    });
    if(!resp.ok){
      if(resp.status === 401) return {ok:false, error:'That API key was rejected. Check it in Settings.'};
      return {ok:false, error:`Lookup service returned ${resp.status}`};
    }
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    // Models occasionally wrap JSON in prose or fences; pull out the object.
    let cleaned = text.replace(/```json\s*|```/gi,'').trim();
    const braceStart = cleaned.indexOf('{'), braceEnd = cleaned.lastIndexOf('}');
    if(braceStart >= 0 && braceEnd > braceStart) cleaned = cleaned.slice(braceStart, braceEnd+1);
    let parsed;
    try{ parsed = JSON.parse(cleaned); }
    catch(e){ return {ok:false, error:'Could not read the estimate', soft:true}; }
    if(typeof parsed.kcal !== 'number' || !isFinite(parsed.kcal)) return {ok:false, error:'Estimate was incomplete', soft:true};
    return {ok:true, data:parsed};
  }

  try{
    let r = await attempt(description);
    if(!r.ok && r.soft){
      // One retry with an explicit nudge, which recovers most ambiguous names.
      r = await attempt(`${description}\n\n(This is most likely an Indian home-cooked dish. Identify it and return only the JSON object.)`);
    }
    return r;
  }catch(e){
    return {ok:false, error:(e && e.message) || 'Lookup failed'};
  }
}

/* ---- Backup / export ---- */
async function exportAllData(){
  const monthKeys = await listMonthKeys();
  const months = {};
  for(const k of monthKeys){
    const mk = k.replace('dietTracker:days:', '');
    // Normalize to the unwrapped days map regardless of whether it came from the
    // in-memory cache (already unwrapped) or storage (wrapped).
    months[mk] = monthCache[mk] || migrateMonthShard(await loadDataKey(k));
  }
  return {schemaVersion: CURRENT_SCHEMA, exportedAt: new Date().toISOString(), meta, months};
}
async function downloadBackup(){
  const data = await exportAllData();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `diet-tracker-backup-${dateStr(new Date())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---- Import (the cross-device bridge, since window.storage isn't guaranteed
   to follow you between separate artifact instances/devices) ---- */
let importPendingData = null; // parsed, validated backup awaiting merge/replace choice

async function parseBackupFile(file){
  let text;
  try{ text = await file.text(); }catch(e){ return {ok:false, error:'Could not read that file.'}; }
  let data;
  try{ data = JSON.parse(text); }catch(e){ return {ok:false, error:"That file isn't valid JSON."}; }
  if(!data || typeof data !== 'object' || typeof data.months !== 'object' || !data.months){
    return {ok:false, error:"That doesn't look like a Recomp Tracker backup file."};
  }
  if(typeof data.schemaVersion === 'number' && data.schemaVersion > CURRENT_SCHEMA){
    return {ok:false, error:'That backup was made by a newer version of the app. Update the app first, then import.'};
  }
  // Old backups predate the profile and the wrapped month shape. Migrating on
  // import means a backup taken at any point in the app's history stays usable.
  data.meta = migrateMeta(data.meta).meta;
  const migratedMonths = {};
  for(const mk of Object.keys(data.months)){
    migratedMonths[mk] = migrateMonthShard(data.months[mk]);
  }
  data.months = migratedMonths;
  return {ok:true, data};
}
function isDayMeaningfullyEmpty(day){
  if(!day) return true;
  const hasCheckedMeal = day.meals.some(m=>m.checked);
  const hasCustomMeal = day.meals.some(m=>m.id.startsWith('meal-'));
  const hasBody = day.body && (day.body.weight!=null || day.body.bf!=null || day.body.smm!=null);
  const hasTraining = day.training && (day.training.liftingDone || day.training.cardioDone);
  return !hasCheckedMeal && !hasCustomMeal && !hasBody && !hasTraining;
}
async function applyImport(data, mode){
  if(mode === 'replace'){
    monthCache = {};
    for(const mk of Object.keys(data.months)){
      monthCache[mk] = data.months[mk] || {};
      await persistMonth(mk);
    }
    meta = data.meta;
    invalidateFoodPool();
    await persistMeta();
  }else{
    for(const mk of Object.keys(data.months)){
      await ensureMonthLoaded(mk);
      const incomingDays = data.months[mk] || {};
      let changed = false;
      for(const dayKey of Object.keys(incomingDays)){
        const localDay = monthCache[mk][dayKey];
        if(isDayMeaningfullyEmpty(localDay)){
          monthCache[mk][dayKey] = incomingDays[dayKey];
          changed = true;
        }
      }
      if(changed) await persistMonth(mk);
    }
    const existingIds = new Set(meta.customFoods.map(f=>f.id));
    let addedAny = false;
    for(const food of data.meta.customFoods){
      if(!existingIds.has(food.id)){ meta.customFoods.push(food); addedAny = true; }
    }
    if(addedAny){ invalidateFoodPool(); await persistMeta(); }
  }
  render();
}
function renderImportModal(){
  if(!importPendingData) return '';
  const monthCount = Object.keys(importPendingData.months||{}).length;
  const foodCount = (importPendingData.meta.customFoods||[]).length;
  return `
    <div class="modal-backdrop" id="importModalBackdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Import backup">
        <div class="modal-head"><h3>Import backup</h3><button type="button" class="icon-btn" id="importCloseBtn">&times;</button></div>
        <p style="font-size:13px;color:var(--text-muted);line-height:1.5;">This file has ${monthCount} month${monthCount===1?'':'s'} of data and ${foodCount} custom food${foodCount===1?'':'s'}. Choose how to bring it in:</p>
        <div class="modal-actions" style="flex-direction:column;gap:8px;">
          <button type="button" class="btn-primary" id="importMergeBtn">Merge &mdash; only fill in days I don&rsquo;t already have here</button>
          <button type="button" class="btn-ghost" id="importReplaceBtn" style="border-color:var(--training);color:var(--training);">Replace all data here with this backup</button>
          <button type="button" class="btn-ghost" id="importCancelBtn">Cancel</button>
        </div>
      </div>
    </div>
  `;
}
function attachImportModalEvents(){
  const backdrop = document.getElementById('importModalBackdrop');
  if(!backdrop) return;
  const close = ()=>{ importPendingData = null; render(); };
  const dlg = backdrop.querySelector('.modal');
  if(dlg && !dlg.dataset.a11yBound){ dlg.dataset.a11yBound='1'; attachDialogA11y(dlg, close); }
  document.getElementById('importCloseBtn').addEventListener('click', close);
  document.getElementById('importCancelBtn').addEventListener('click', close);
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });
  document.getElementById('importMergeBtn').addEventListener('click', async ()=>{
    const data = importPendingData; importPendingData = null;
    await applyImport(data, 'merge');
  });
  document.getElementById('importReplaceBtn').addEventListener('click', async ()=>{
    if(!confirm('This replaces every day and custom food currently stored here with the backup. Continue?')) return;
    const data = importPendingData; importPendingData = null;
    await applyImport(data, 'replace');
  });
}

/* ===================== RENDER: MACRO PANEL ===================== */
/* SIGNATURE ELEMENT — the macro dial.
   The subject's world is measurement: nutrition labels, InBody printouts,
   calibrated scales. So the day reads as an instrument gauge rather than a
   stack of generic progress bars. Calories are the primary dial with tick
   marks; the three macros sit beneath as smaller companion arcs. */
function dialArc(pct, radius, stroke, color, cx, cy, trackColor){
  const C = 2 * Math.PI * radius;
  const p = Math.max(0, Math.min(1, pct));
  const filled = p * C;
  const track = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${trackColor}" stroke-width="${stroke}"/>`;
  // At zero, a round line cap would still paint a dot at 12 o'clock, so draw
  // nothing at all — an untouched dial should read as genuinely empty.
  if(filled <= 0.01) return track;
  return track + `
    <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${color}" stroke-width="${stroke}"
            stroke-linecap="round" stroke-dasharray="${filled.toFixed(2)} ${(C-filled).toFixed(2)}"
            transform="rotate(-90 ${cx} ${cy})" class="dial-arc"/>`;
}
function dialTicks(cx, cy, radius){
  // Calibration marks every 10% — the instrument cue that gives the dial its character.
  let out = '';
  for(let i=0;i<10;i++){
    const a = (i/10) * Math.PI*2 - Math.PI/2;
    const r1 = radius + 9, r2 = radius + (i % 5 === 0 ? 14 : 12);
    const x1 = cx + Math.cos(a)*r1, y1 = cy + Math.sin(a)*r1;
    const x2 = cx + Math.cos(a)*r2, y2 = cy + Math.sin(a)*r2;
    out += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
            stroke="var(--tick)" stroke-width="${i % 5 === 0 ? 1.6 : 1}" stroke-linecap="round"/>`;
  }
  return out;
}
function renderMacroRow(r){
  const pct = r.target > 0 ? r.eaten / r.target : 0;
  const over = r.eaten > r.target * 1.001;
  const dec = r.key === 'kcal' ? 0 : 1;
  const R = 26, S = 6, CX = 34, CY = 34;
  return `
    <div class="macro-mini">
      <svg viewBox="0 0 68 68" class="mini-dial" aria-hidden="true">
        ${dialArc(pct, R, S, r.color, CX, CY, 'var(--track)')}
      </svg>
      <div class="mini-label">${r.label}</div>
      <div class="macro-value ${over?'over':''}">${r.eaten.toFixed(dec)}${r.unit} / ${r.target.toFixed(dec)}${r.unit}</div>
    </div>`;
}
function renderMacroPanel(eaten, planTotal, target, type){
  const kcalPct = target.kcal > 0 ? eaten.kcal / target.kcal : 0;
  const planPct = target.kcal > 0 ? planTotal.kcal / target.kcal : 0;
  const remaining = target.kcal - eaten.kcal;
  const over = eaten.kcal > target.kcal * 1.001;

  const macros = [
    {key:'p', label:'Protein', unit:'g', color:'var(--protein)', eaten:eaten.p, target:target.p},
    {key:'c', label:'Carbs',   unit:'g', color:'var(--carbs)',   eaten:eaten.c, target:target.c},
    {key:'f', label:'Fat',     unit:'g', color:'var(--fat)',     eaten:eaten.f, target:target.f},
    {key:'fib', label:'Fiber', unit:'g', color:'var(--fiber)',   eaten:eaten.fib||0, target:fiberTargetFor(target)},
  ];

  // Ghost arc shows where the full day's plan would land — the difference
  // between "eaten" and "planned" is the actionable gap.
  const R = 62, CX = 80, CY = 80;
  const C = 2 * Math.PI * R;
  const ghost = Math.max(0, Math.min(1, planPct)) * C;

  return `
    <section class="macro-panel ${type}">
      <div class="dial-wrap">
        <svg viewBox="0 0 160 160" class="main-dial" role="img" aria-label="Calories ${eaten.kcal.toFixed(0)} of ${target.kcal.toFixed(0)}">
          ${dialTicks(CX, CY, R)}
          <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--track)" stroke-width="10"/>
          ${ghost > 0.01 ? `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--ghost)" stroke-width="10"
                  stroke-dasharray="${ghost.toFixed(2)} ${(C-ghost).toFixed(2)}" transform="rotate(-90 ${CX} ${CY})"/>` : ''}
          ${dialArc(kcalPct, R, 10, over ? 'var(--over)' : 'var(--kcal)', CX, CY, 'transparent')}
        </svg>
        <div class="dial-center">
          <div class="dial-figure ${over?'over':''}">${eaten.kcal.toFixed(0)}</div>
          <div class="dial-unit">of ${target.kcal.toFixed(0)} kcal</div>
          <div class="dial-remaining">${over ? `${Math.abs(remaining).toFixed(0)} over` : `${remaining.toFixed(0)} left`}</div>
        </div>
      </div>
      <div class="macro-value kcal-value ${over?'over':''}">${eaten.kcal.toFixed(0)} / ${target.kcal.toFixed(0)}</div>
      <div class="macro-minis">
        ${macros.map(renderMacroRow).join('')}
      </div>
      <div class="plan-footnote">Today&rsquo;s full plan: ${planTotal.kcal.toFixed(0)} kcal &middot; ${planTotal.p.toFixed(0)}P / ${planTotal.c.toFixed(0)}C / ${planTotal.f.toFixed(0)}F</div>
    </section>
  `;
}
